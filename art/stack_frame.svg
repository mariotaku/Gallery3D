<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 64 64"
     g3d:outputs="drawable=64x64">
  <!-- A texture rather than an icon. GridQuadFrame maps each quarter of it to a
       corner of the photo and stretches the middle row and column along the
       edges, so the border keeps the insets the code was written for. The
       border casts a tight shadow and a wide soft one, both a little below. -->
  <defs>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="52">
      <stop offset="0" stop-color="rgb(255.000,255.000,255.000)"/>
      <stop offset="0.55" stop-color="rgb(254.000,254.000,254.000)"/>
      <stop offset="1" stop-color="rgb(255.000,255.000,255.000)"/>
    </linearGradient>
    <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="rgb(0.000,0.000,0.000)"/>
      <stop offset="1" stop-color="rgb(0.000,0.000,0.000)"/>
    </linearGradient>
    <filter id="near" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.100"/>
    </filter>
    <filter id="far" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.000"/>
    </filter>
  </defs>
  <rect x="11.150" y="10.350" width="41.925" height="41.900" fill="none" stroke="url(#glow)" stroke-width="6.300"
        opacity="0.400" filter="url(#far)"/>
  <rect x="11.150" y="11.750" width="41.925" height="41.900" fill="none" stroke="url(#glow)" stroke-width="4.600"
        opacity="0.191" filter="url(#near)"/>
  <rect x="11.150" y="7.750" width="41.925" height="41.900" fill="none" stroke="url(#border)" stroke-width="3.400"/>
</svg>
