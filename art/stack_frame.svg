<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 64 64"
     g3d:outputs="drawable=64x64">
  <!-- A texture rather than an icon. GridQuadFrame maps each quarter of it to a
       corner of the photo and stretches the middle row and column along the
       edges, so the border keeps the insets the code was written for: 9.3 to
       12.8 from the left and right, 6.1 to 9.6 from the top, 12.4 to 15.9 from
       the bottom. The middle stays clear for the photo. -->
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeeeee"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- The print's shadow on the wall, lit from above, so it falls further below. -->
  <rect x="11.05" y="10.1" width="41.9" height="42" fill="none" stroke="#000000" stroke-width="4.5"
        opacity="0.6" filter="url(#soft)"/>
  <rect x="11.05" y="7.85" width="41.9" height="42" fill="none" stroke="url(#border)" stroke-width="3.5"/>
</svg>
