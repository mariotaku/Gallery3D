<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 43 43"
     g3d:name="btn_hud_zoom_in_pressed" g3d:outputs="drawable=43x43">
  <!-- The fallback drawable's pressed zoom in key, drawn like
       btn_hud_zoom_in_pressed.svg but in its own 43 pixel grid, where its
       older art keeps the yellow edge to a single pixel. -->
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="7.124" y1="0" x2="43" y2="0">
      <stop offset="0" stop-color="#eaa208"/>
      <stop offset="0.568" stop-color="#f2c03c"/>
      <stop offset="1" stop-color="#fbdc63"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(97%,88.458%,67%)"/>
      <stop offset="1" stop-color="rgb(96%,92.75%,71.458%)"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.919" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="key">
      <rect x="7.124" y="7.293" width="60" height="60" rx="3.117"/>
    </clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="90" height="90">
      <feGaussianBlur stdDeviation="2.183"/>
    </filter>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="90" height="90">
      <feGaussianBlur stdDeviation="1.572"/>
    </filter>
    <g id="glyph">
      <circle cx="25.21" cy="23.358" r="5.82" fill="none" stroke-width="2.924"/>
      <line x1="31.184" y1="29.336" x2="35.144" y2="33.275" stroke-width="3.724" stroke-linecap="round"/>
      <rect x="22.228" y="22.36" width="6.119" height="1.72" stroke="none"/>
      <rect x="24.212" y="20.177" width="1.72" height="6.119" stroke="none"/>
    </g>
  </defs>

  <rect x="4.118" y="3.953" width="60" height="60" rx="8.137" fill="#f2bd39" opacity="1" filter="url(#glow)"/>
  <rect x="5.851" y="7.277" width="60" height="60" rx="3.027" fill="#ffe400"/>
  <rect x="7.124" y="7.293" width="60" height="60" rx="3.117" fill="url(#gold)"/>
  <g clip-path="url(#key)">
    <rect x="0" y="41.379" width="43" height="1.571" fill="#b87800" opacity="0.23"/>
  </g>

  <circle cx="25.21" cy="23.358" r="5.226" fill="#8a5c00" opacity="0"/>
  <use href="#glyph" fill="#6a4500" stroke="#6a4500" opacity="1" filter="url(#edge)"/>
  <circle cx="25.21" cy="23.358" r="5.82" fill="none" stroke="url(#ring)" stroke-width="2.924" opacity="0.927"/>
  <line x1="31.184" y1="29.336" x2="35.144" y2="33.275" stroke="url(#ring)" stroke-width="3.724" stroke-linecap="round"
        opacity="1"/>
  <g fill="rgb(96%,94.521%,73%)" opacity="0.905">
    <rect x="22.228" y="22.36" width="6.119" height="1.72"/>
    <rect x="24.212" y="20.177" width="1.72" height="6.119"/>
  </g>
  <circle cx="25.21" cy="23.358" r="5.82" fill="none" stroke="url(#catch)" stroke-width="1.195" opacity="0.175"/>
</svg>
