<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 163 48"
     g3d:name="scroller_new" g3d:outputs="drawable=163x48">
  <!-- The fallback folder's time bar handle: glass with small rounded top
       corners that runs off the bottom of the canvas, a grey edge, dimpled
       grip dots, an embossed arrow at each end, and a wide soft shadow. -->
  <defs>
    <path id="tab" d="M 13.4 60 V 18.4 A 5 5 0 0 1 18.4 13.4 H 144.6 A 5 5 0 0 1 149.6 18.4 V 60 Z"/>
    <clipPath id="inside">
      <use href="#tab"/>
    </clipPath>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="0" y1="13.4" x2="0" y2="48">
      <stop offset="0.032" stop-color="#ffffff" stop-opacity="0.63"/>
      <stop offset="0.061" stop-color="#fdfdfd" stop-opacity="0.525"/>
      <stop offset="0.205" stop-color="#f7f7f7" stop-opacity="0.514"/>
      <stop offset="0.35" stop-color="#f0f0f0" stop-opacity="0.482"/>
      <stop offset="0.552" stop-color="#e5e5e5" stop-opacity="0.427"/>
      <stop offset="0.565" stop-color="#e2e2e2" stop-opacity="0.42"/>
      <stop offset="0.566" stop-color="#dcdcdc" stop-opacity="0.376"/>
      <stop offset="0.783" stop-color="#cdcdcd" stop-opacity="0.322"/>
      <stop offset="0.986" stop-color="#bcbcbc" stop-opacity="0.267"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130">
      <rect x="-40" y="-40" width="250" height="130" fill="#ffffff"/>
      <use href="#tab" fill="#000000"/>
    </mask>
    <filter id="emboss" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <g id="dots">
      <rect x="-1.3" y="0" width="2.6" height="2.6"/>
      <rect x="7.45" y="0" width="2.6" height="2.6"/>
      <rect x="16.2" y="0" width="2.6" height="2.6"/>
      <rect x="24.95" y="0" width="2.6" height="2.6"/>
      <rect x="33.7" y="0" width="2.6" height="2.6"/>
      <rect x="42.45" y="0" width="2.6" height="2.6"/>
      <rect x="51.2" y="0" width="2.6" height="2.6"/>
      <rect x="59.95" y="0" width="2.6" height="2.6"/>
      <rect x="68.7" y="0" width="2.6" height="2.6"/>
    </g>
  </defs>
  <g mask="url(#outside)">
    <use href="#tab" fill="#000000" opacity="0.44" filter="url(#soft)"/>
  </g>
  <use href="#tab" fill="url(#glass)"/>
  <g clip-path="url(#inside)">
    <use href="#tab" fill="none" stroke="#8a8a8a" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="-2" y="13.4" width="170" height="0.8" fill="#6a6a6a" fill-opacity="0.35"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.12">
    <use href="#dots" transform="translate(47.5 23.4)"/>
    <use href="#dots" transform="translate(47.5 30.5)"/>
    <use href="#dots" transform="translate(47.5 38.4)"/>
  </g>
  <g fill="#000000" fill-opacity="0.58">
    <use href="#dots" transform="translate(47.5 21.9)"/>
    <use href="#dots" transform="translate(47.5 29)"/>
    <use href="#dots" transform="translate(47.5 36.9)"/>
  </g>
  <g filter="url(#emboss)" fill="#ffffff" fill-opacity="0.5">
    <path d="M 21 30.75 L 32 25 V 36.5 Z"/>
    <path d="M 142 30.75 L 131 25 V 36.5 Z"/>
  </g>
</svg>
