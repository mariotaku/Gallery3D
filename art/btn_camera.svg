<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 150 150"
     g3d:outputs="drawable-mdpi=100x100 drawable-hdpi=150x150">
  <!-- The shutter button: a disc of smoked glass tucked into the top right
       corner, glossier above a curved line, with a white rim and a soft
       shadow outside. On it sits a white camera with a cut corner, a flash
       tab, a viewfinder hump and a lens ring cut through to the glass, over
       its own soft shadow. The fallback folder's button is
       btn_camera-small.svg. -->
  <defs>
    <clipPath id="pane">
      <circle cx="157.338" cy="-20.506" r="115.428"/>
    </clipPath>
    <mask id="outsidePane" maskUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <rect x="-20" y="-60" width="200" height="240" fill="#ffffff"/>
      <circle cx="157.338" cy="-20.506" r="115.428" fill="#000000"/>
    </mask>
    <filter id="paneShadow" filterUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <feGaussianBlur stdDeviation="5.188"/>
    </filter>
    <path id="gloss" d="M 30 -20 L 46.25 -2 C 47.3 19.522 64.425 31.55 77.55 35.5 S 135.875 39.5 180 40.5 L 180 -20 Z"/>
    <clipPath id="glossy">
      <use href="#gloss"/>
    </clipPath>
    <mask id="matte" maskUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <rect x="-20" y="-60" width="200" height="240" fill="#ffffff"/>
      <use href="#gloss" fill="#000000"/>
    </mask>
    <linearGradient id="upper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="40">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.271"/>
    </linearGradient>
    <linearGradient id="lower" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.184"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <g id="camera">
      <path d="M 89.644 19.25 H 98.075 V 20.812 L 89.644 24.958 Z"/>
      <path d="M 104.838 24 V 20.2 L 107.469 16.825 H 118.125 L 120.35 20.2 V 24 Z"/>
      <path d="M 99.725 22.5 H 136.5 V 55.5 H 88.15 V 27.887 Z"/>
    </g>
    <mask id="lens" maskUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <rect x="-20" y="-60" width="200" height="240" fill="#ffffff"/>
      <circle cx="112.45" cy="40.419" r="9.975" fill="none" stroke="#000000" stroke-width="3.95"/>
    </mask>
    <mask id="offCamera" maskUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <rect x="-20" y="-60" width="200" height="240" fill="#ffffff"/>
      <use href="#camera" fill="#000000"/>
      <circle cx="112.45" cy="40.419" r="9.975" fill="none" stroke="#ffffff" stroke-width="3.95"/>
    </mask>
    <filter id="cameraShadow" filterUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <feGaussianBlur stdDeviation="3.862"/>
    </filter>
  </defs>

  <g mask="url(#outsidePane)">
    <circle cx="157.338" cy="-20.506" r="115.428" fill="#000000" opacity="0.484" filter="url(#paneShadow)"/>
  </g>
  <g clip-path="url(#pane)">
    <rect x="0" y="0" width="150" height="150" fill="#000000" opacity="0.085"/>
    <rect x="0" y="0" width="150" height="150" fill="url(#lower)" mask="url(#matte)"/>
    <rect x="0" y="0" width="150" height="150" fill="url(#upper)" clip-path="url(#glossy)"/>
    <circle cx="157.338" cy="-20.506" r="114.6" fill="none" stroke="#ffffff" stroke-opacity="0.206" stroke-width="1.671"/>
  </g>

  <g mask="url(#offCamera)">
    <g opacity="0.561" filter="url(#cameraShadow)">
      <use href="#camera" transform="translate(0 3.656)" mask="url(#lens)"/>
    </g>
  </g>
  <circle cx="112.45" cy="40.419" r="9.975" fill="none" stroke="#000000" stroke-opacity="0.028" stroke-width="3.95"/>
  <use href="#camera" fill="#ffffff" fill-opacity="0.795" mask="url(#lens)"/>
</svg>
