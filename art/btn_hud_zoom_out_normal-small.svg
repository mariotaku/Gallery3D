      <stop offset="1" stop-color="rgb(83.625%,83.625%,83.625%)"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(93%,93%,93%)"/>
      <stop offset="1" stop-color="rgb(87.438%,87.438%,87.438%)"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
