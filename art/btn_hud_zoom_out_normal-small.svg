<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 65 68"
     g3d:name="btn_hud_zoom_out_normal" g3d:outputs="drawable=43x45">
  <!-- The fallback drawable's zoom out key, drawn like
