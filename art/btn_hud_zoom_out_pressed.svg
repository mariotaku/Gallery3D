<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 65 68"
     g3d:outputs="drawable-mdpi=43x45 drawable-hdpi=65x68">
  <!-- The zoom out key held down: btn_hud_zoom_in_pressed.svg's gold key
       turned upside down, with the magnifier the right way up and a minus in
       its lens. Drawn in hdpi pixels; the fallback drawable's older art is
       btn_hud_zoom_out_pressed-small.svg. -->
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="11.519" y1="0" x2="65" y2="0">
      <stop offset="0" stop-color="#eaa208"/>
      <stop offset="0.525" stop-color="#f2c03c"/>
      <stop offset="1" stop-color="#fbdc63"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(97%,84.5%,60%)"/>
      <stop offset="1" stop-color="rgb(96%,92.75%,72.25%)"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.928" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="key">
      <rect x="11.519" y="10.378" width="80" height="80" rx="5.164"/>
    </clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="3.3"/>
    </filter>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="2.45"/>
    </filter>
    <g id="glyph">
      <circle cx="37.739" cy="26.874" r="8.438" fill="none" stroke-width="4.296"/>
      <line x1="44.95" y1="34.816" x2="52.5" y2="41.75" stroke-width="5.15" stroke-linecap="round"/>
      <rect x="33.6" y="25.438" width="8.95" height="2.6" stroke="none"/>
    </g>
  </defs>

  <!-- The key in the zoom in key's coordinates, turned over. -->
  <g transform="translate(0 68) scale(1 -1)">
    <rect x="6.231" y="5.412" width="80" height="80" rx="12.62" fill="#f2bd39" opacity="1" filter="url(#glow)"/>
    <rect x="9.356" y="8.428" width="80" height="80" rx="7.5" fill="#ffe400"/>
    <rect x="11.519" y="10.378" width="80" height="80" rx="5.164" fill="url(#gold)"/>
    <g clip-path="url(#key)">
      <!-- Where this key meets the one above. -->
      <rect x="0" y="62.25" width="65" height="2.375" fill="#b87800" opacity="0"/>
    </g>
  </g>

  <circle cx="37.739" cy="26.874" r="7.9" fill="#8a5c00" opacity="0.073"/>
  <use href="#glyph" fill="#6a4500" stroke="#6a4500" opacity="0.976" filter="url(#edge)"/>
  <circle cx="37.739" cy="26.874" r="8.438" fill="none" stroke="url(#ring)" stroke-width="4.296" opacity="0.888"/>
  <line x1="44.95" y1="34.816" x2="52.5" y2="41.75" stroke="url(#ring)" stroke-width="5.15" stroke-linecap="round"
        opacity="0.998"/>
  <rect x="33.6" y="25.438" width="8.95" height="2.6" fill="rgb(96%,89.75%,72%)" opacity="0.865"/>
  <circle cx="37.739" cy="26.874" r="8.438" fill="none" stroke="url(#catch)" stroke-width="1.712" opacity="0.32"/>
</svg>
