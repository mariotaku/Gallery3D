      <line x1="46.937" y1="34.825" x2="53.231" y2="41.637" stroke-width="5.309" stroke-linecap="round"/>
      <rect x="33.437" y="25.7" width="8.95" height="2.6" stroke="none"/>
    </g>
  </defs>

  <g transform="translate(0 68) scale(1 -1)">
    <rect x="6.133" y="5.862" width="80" height="80" rx="12.559" fill="#f2bd39" opacity="1" filter="url(#glow)"/>
    <rect x="9.431" y="8.803" width="80" height="80" rx="7.344" fill="#ffe400"/>
    <rect x="11.519" y="10.425" width="80" height="80" rx="5.074" fill="url(#gold)"/>
