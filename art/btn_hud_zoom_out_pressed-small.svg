<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 65 68"
     g3d:name="btn_hud_zoom_out_pressed" g3d:outputs="drawable=43x45">
  <!-- The fallback drawable's pressed zoom out key, drawn like
       btn_hud_zoom_out_pressed.svg in hdpi pixels. -->
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="11.519" y1="0" x2="65" y2="0">
      <stop offset="0" stop-color="#eaa208"/>
      <stop offset="0.544" stop-color="#f2c03c"/>
      <stop offset="1" stop-color="#fbdc63"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(97%,89%,67.438%)"/>
      <stop offset="1" stop-color="rgb(96%,93.375%,73%)"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.925" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="key">
