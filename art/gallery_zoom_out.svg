<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 66 42" width="66" height="42"
     g3d:outputs="drawable=66x42">
  <!-- The zoom out tab: the left half of art/templates/capsule.svg, cut a
       pixel short of the middle so a two pixel gap parts it from the zoom in
       tab. The cut side is straight and carries the capsule's edge at the
       width it has halfway round an end. A white magnifier with a minus sits
       on the glass, with its dark edge. -->
  <defs>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="0" y1="7" x2="0" y2="35">
      <stop offset="0.02" stop-color="#fdfdfd" stop-opacity="0.267"/>
      <stop offset="0.30" stop-color="#eeeeee" stop-opacity="0.243"/>
      <stop offset="0.54" stop-color="#dedede" stop-opacity="0.204"/>
      <stop offset="0.58" stop-color="#d6d6d6" stop-opacity="0.180"/>
      <stop offset="0.62" stop-color="#cdcdcd" stop-opacity="0.161"/>
      <stop offset="0.78" stop-color="#bebebe" stop-opacity="0.133"/>
      <stop offset="0.98" stop-color="#b1b1b1" stop-opacity="0.110"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="7" x2="0" y2="35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bdbdbd" stop-opacity="0.2"/>
    </linearGradient>
    <path id="shape" d="M 65 7 H 20 A 14 14 0 0 0 20 35 H 65 Z"/>
    <path id="inner" d="M 64.25 7.5 H 20 A 13.25 13.25 0 0 0 20 34 H 64.25 Z"/>
    <mask id="band" maskUnits="userSpaceOnUse" x="0" y="0" width="66" height="42">
      <use href="#shape" fill="#ffffff"/>
      <use href="#inner" fill="#000000"/>
    </mask>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-20" y="-20" width="106" height="82">
      <rect x="-20" y="-20" width="106" height="82" fill="#ffffff"/>
      <use href="#shape" fill="#000000"/>
    </mask>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="106" height="82">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="glyphEdge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="106" height="82">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <g id="glyph">
      <circle cx="25.963" cy="20.942" r="7.198" fill="none" stroke-width="2.55"/>
      <line x1="32.4" y1="27.375" x2="37.9" y2="32.692" stroke-width="2.875" stroke-linecap="round"/>
      <rect x="22.813" y="19.942" width="6.3" height="2" stroke="none"/>
    </g>
  </defs>

  <g mask="url(#outside)">
    <use href="#shape" transform="translate(0 -0.25)" fill="#000000" opacity="0.205" filter="url(#shadow)"/>
  </g>
  <use href="#shape" fill="url(#glass)"/>
  <g mask="url(#band)">
    <rect x="0" y="0" width="66" height="42" fill="url(#edge)"/>
  </g>

  <use href="#glyph" fill="#000000" stroke="#000000" opacity="0.258" filter="url(#glyphEdge)"/>
  <use href="#glyph" fill="#ffffff" stroke="#ffffff" opacity="0.961"/>
</svg>
