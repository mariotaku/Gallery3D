<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 66 42"
     g3d:outputs="drawable=66x42">
  <!-- The zoom out tab: gallery_zoom_in.svg's frosted glass mirrored, coming in
       from the right edge and rounded at its left end, with a minus in the
       magnifier. -->
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="7.381" x2="0" y2="31.15">
      <stop offset="0" stop-color="rgb(100%,100%,100%)" stop-opacity="0.22"/>
      <stop offset="0.525" stop-color="rgb(82.5%,82.5%,82.5%)" stop-opacity="0.18"/>
      <stop offset="1" stop-color="rgb(45%,45%,45%)" stop-opacity="0.072"/>
    </linearGradient>
    <clipPath id="inside">
      <rect x="7.719" y="7.381" width="100" height="27.013" rx="10.956"/>
    </clipPath>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="80">
      <rect x="-20" y="-20" width="140" height="80" fill="#ffffff"/>
      <rect x="7.719" y="7.381" width="100" height="27.013" rx="10.956" fill="#000000"/>
    </mask>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="80">
      <feGaussianBlur stdDeviation="1.143"/>
    </filter>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="80">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <g id="glyph">
      <circle cx="25.963" cy="20.942" r="7.198" fill="none" stroke-width="2.55"/>
      <line x1="32.4" y1="27.375" x2="37.9" y2="32.692" stroke-width="2.875" stroke-linecap="round"/>
      <rect x="23.25" y="19.75" width="6.3" height="2" stroke="none"/>
    </g>
  </defs>

  <g mask="url(#outside)">
    <rect x="7.719" y="7.381" width="100" height="27.013" rx="10.956" fill="#000000" opacity="0.19" filter="url(#shadow)"/>
  </g>
  <rect x="7.719" y="7.381" width="100" height="27.013" rx="10.956" fill="url(#body)"/>
  <g clip-path="url(#inside)">
    <rect x="7.719" y="7.381" width="100" height="27.013" rx="10.956" fill="none" stroke="#ffffff" stroke-opacity="0"
          stroke-width="2.394"/>
    <!-- A lit row along the top edge and another along the bottom. -->
    <rect x="-20" y="7.381" width="120" height="0.4" fill="#ffffff" opacity="0"/>
    <rect x="-20" y="32.819" width="120" height="1" fill="#ffffff" opacity="0.1"/>
  </g>
  <!-- A grey line under the glass, where its edge catches the light below. -->
  <rect x="7.719" y="7.631" width="100" height="26.954" rx="10.956" fill="rgb(54%,54%,54%)" opacity="0.11"
        mask="url(#outside)"/>

  <use href="#glyph" fill="#000000" stroke="#000000" opacity="0.258" filter="url(#edge)"/>
  <use href="#glyph" fill="#ffffff" stroke="#ffffff" opacity="0.961"/>
</svg>
