<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 72 72"
     g3d:outputs="drawable=72x72">
  <!-- Turns the photo a quarter to the right: rotate left, mirrored. -->
  <defs>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4c4c4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g transform="translate(72 0) scale(-1 1)" fill="url(#glyph)">
      <path d="M17.71 42.84 A20 20 0 1 0 23.64 20.68" fill="none" stroke="url(#glyph)" stroke-width="9"/>
      <path d="M20.6 10.6 L22.6 37.2 L3.9 25.4 Z" stroke="url(#glyph)" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="36.5" cy="36" r="4.3"/>
    </g>
  </g>
</svg>
