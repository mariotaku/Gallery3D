<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 78 78"
     g3d:outputs="drawable=78x78">
  <!-- The Picasa badge on a web album's stack, drawn at the size the wall
       samples it: a white pinwheel of five blades around a pentagonal hole,
       ringed by the same dark halo as the other badges. -->
  <defs>
    <mask id="blades" maskUnits="userSpaceOnUse" x="0" y="0" width="78" height="78">
      <circle cx="39" cy="39" r="16" fill="#ffffff"/>
      <g fill="#000000" stroke="#000000" stroke-width="1.3">
        <path d="M40.6 29.7 L46.5 34.2 L46.5 44.5 L31.5 44.5 L31.5 37.8 Z" stroke="none"/>
        <line x1="40.6" y1="29.7" x2="22.9" y2="16.2"/>
        <line x1="46.5" y1="34.2" x2="46.5" y2="10"/>
        <line x1="46.5" y1="44.5" x2="70" y2="44.5"/>
        <line x1="31.5" y1="44.5" x2="31.5" y2="70"/>
        <line x1="31.5" y1="37.8" x2="4" y2="62.3"/>
      </g>
    </mask>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0.4" stdDeviation="2.5" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>
  <g filter="url(#halo)">
    <rect x="0" y="0" width="78" height="78" fill="#ffffff" mask="url(#blades)"/>
  </g>
</svg>
