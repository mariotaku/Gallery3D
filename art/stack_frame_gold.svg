<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 64 64"
     g3d:outputs="drawable=64x64">
  <!-- A texture rather than an icon. GridQuadFrame maps each quarter of it to a
       corner of the photo and stretches the middle row and column along the
       edges, so the border keeps the insets the code was written for. The
       border glows, with its own spread and strength outside and inside, and
       the glow's colour shifts from top to bottom. -->
  <defs>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="52">
      <stop offset="0" stop-color="rgb(252.000,255.000,255.000)"/>
      <stop offset="0.55" stop-color="rgb(255.000,255.000,258.000)"/>
      <stop offset="1" stop-color="rgb(255.000,255.000,255.000)"/>
    </linearGradient>
    <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="rgb(207.000,205.000,0.000)"/>
      <stop offset="1" stop-color="rgb(248.000,180.000,0.000)"/>
    </linearGradient>
    <filter id="outerBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.500"/></filter>
    <filter id="innerBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4.000"/></filter>
    <filter id="nearBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.412"/></filter>
    <mask id="outside" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#ffffff"/>
      <rect x="9.450" y="6.050" width="45.100" height="45.300" fill="#000000"/>
    </mask>
    <mask id="inside" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="12.850" y="9.450" width="38.300" height="38.500" fill="#ffffff"/>
    </mask>
  </defs>
  <g mask="url(#outside)">
    <rect x="11.150" y="11.000" width="41.700" height="41.900" fill="none" stroke="url(#glow)" stroke-width="5.600"
          opacity="0.700" filter="url(#outerBlur)"/>
  </g>
  <g mask="url(#inside)">
    <rect x="11.150" y="9.250" width="41.700" height="41.900" fill="none" stroke="url(#glow)" stroke-width="4.800"
          opacity="0.597" filter="url(#innerBlur)"/>
  </g>
  <rect x="11.150" y="7.750" width="41.700" height="41.900" fill="none" stroke="url(#glow)" stroke-width="2.500"
        opacity="1.000" filter="url(#nearBlur)"/>
  <rect x="11.150" y="7.750" width="41.700" height="41.900" fill="none" stroke="url(#border)" stroke-width="3.400"/>
</svg>
