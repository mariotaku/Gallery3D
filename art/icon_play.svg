<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 30 30"
     g3d:name="icon_play" g3d:outputs="drawable-hdpi=45x45">
  <!-- The selection bar's slideshow: a grey play triangle with rounded left
       corners, lit from above, in a soft halo of shadow. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="5.281" x2="0" y2="25.6">
      <stop offset="0" stop-color="rgb(231,231,231)"/>
      <stop offset="1" stop-color="rgb(162,162,162)"/>
    </linearGradient>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.995"/>
      <feOffset dx="0" dy="0.571" result="nb"/>
      <feColorMatrix in="nb" type="matrix" values="0 0 0 0 0.344  0 0 0 0 0.344  0 0 0 0 0.344  0 0 0 0.985 0" result="near"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.599"/>
      <feOffset dx="0" dy="0.75" result="fb"/>
      <feColorMatrix in="fb" type="matrix" values="0 0 0 0 0.344  0 0 0 0 0.344  0 0 0 0 0.344  0 0 0 0.883 0" result="far"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <polygon points="7.27,5.6 7.27,24.07 24.07,15"
             fill="rgb(225,225,225)" stroke="rgb(225,225,225)" stroke-width="2.75" stroke-linejoin="round"/>
    <polygon points="7.27,5.6 7.27,24.07 24.07,15"
             fill="url(#face)" stroke="url(#face)" stroke-width="2.025" stroke-linejoin="round"/>
  </g>
</svg>
