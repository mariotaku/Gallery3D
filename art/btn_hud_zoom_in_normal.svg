<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 65 65"
     g3d:outputs="drawable-mdpi=43x43 drawable-hdpi=65x65">
  <!-- The upper half of the zoom rocker at the right edge of the screen: a
       smoked glass key rounded at its top left, running off the right edge and
       down into the zoom out key. The magnifier's lens is dark glass, its ring
       and handle lit from above. Drawn in hdpi pixels; the fallback drawable's
       older art is btn_hud_zoom_in_normal-small.svg. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="9.547" y1="0" x2="65" y2="0">
      <stop offset="0" stop-color="rgb(27.75%,27.75%,27.75%)"/>
      <stop offset="1" stop-color="rgb(83.5%,83.5%,83.5%)"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(93%,93%,93%)"/>
      <stop offset="1" stop-color="rgb(89.5%,89.5%,89.5%)"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.225" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="key">
      <rect x="9.547" y="8.657" width="80" height="80" rx="7.25"/>
    </clipPath>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <rect x="-20" y="-20" width="120" height="120" fill="#ffffff"/>
      <rect x="9.547" y="8.657" width="80" height="80" rx="7.25" fill="#000000"/>
    </mask>
    <mask id="notGlyph" maskUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <rect x="-20" y="-20" width="120" height="120" fill="#ffffff"/>
      <use href="#glyph" fill="#000000" stroke="#000000"/>
    </mask>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="2.516"/>
    </filter>
    <g id="glyph">
      <circle cx="37.782" cy="35.937" r="8.475" fill="none" stroke-width="4.266"/>
      <line x1="46.8" y1="45.55" x2="52.5" y2="50.775" stroke-width="5.278" stroke-linecap="round"/>
      <rect x="33.15" y="34.7" width="9.15" height="2.6" stroke="none"/>
      <rect x="36.6" y="31.4" width="2.6" height="9.15" stroke="none"/>
    </g>
  </defs>

  <g mask="url(#outside)">
    <rect x="9.547" y="8.657" width="80" height="80" rx="7.25" fill="#000000" opacity="0.821" filter="url(#shadow)"/>
  </g>
  <!-- The glass is cut away under the magnifier, which is its own paler,
       denser layer rather than a tint on the glass. -->
  <g mask="url(#notGlyph)">
    <rect x="9.547" y="8.657" width="80" height="80" rx="7.25" fill="url(#face)" fill-opacity="0.41"/>
    <g clip-path="url(#key)">
      <rect x="9.547" y="8.657" width="80" height="80" rx="7.25" fill="none" stroke="rgb(55%,55%,55%)"
            stroke-opacity="0.38" stroke-width="3.281"/>
      <!-- Where this key meets the one below. -->
      <rect x="0" y="62.85" width="65" height="0.3" fill="#000000" opacity="0.255"/>
    </g>
    <circle cx="37.782" cy="35.937" r="8.162" fill="#000000" opacity="0.006"/>
    <use href="#glyph" fill="#000000" stroke="#000000" opacity="0.633" filter="url(#edge)"/>
  </g>
  <circle cx="37.782" cy="35.937" r="8.475" fill="none" stroke="url(#ring)" stroke-width="4.266" opacity="0.74"/>
  <line x1="46.8" y1="45.55" x2="52.5" y2="50.775" stroke="url(#ring)" stroke-width="5.278" stroke-linecap="round"
        opacity="0.755"/>
  <g fill="rgb(78.5%,78.5%,78.5%)" opacity="0.765">
    <rect x="33.15" y="34.7" width="9.15" height="2.6"/>
    <rect x="36.6" y="31.4" width="2.6" height="9.15"/>
  </g>
  <!-- The light catching the top of the ring. -->
  <circle cx="37.782" cy="35.937" r="8.475" fill="none" stroke="url(#catch)" stroke-width="0.3" opacity="0.02"/>
</svg>
