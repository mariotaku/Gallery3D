<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 33 33"
     g3d:outputs="drawable=34x34 drawable-mdpi=33x33 drawable-hdpi=50x50">
  <!-- The selection bar's more: a button that drops a menu down. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#b0b0b0"/>
    </linearGradient>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>
  <g filter="url(#drop)" fill="url(#face)">
    <path d="M16.5 3.6 A12.9 12.9 0 1 1 16.49 3.6 Z M16.5 8.2 A8.3 8.3 0 1 0 16.51 8.2 Z" fill-rule="evenodd"/>
  </g>
  <!-- A sunken well, dark and shadowed along its top, with the arrow in it. -->
  <circle cx="16.5" cy="16.5" r="8.3" fill="#000000" fill-opacity="0.3"/>
  <circle cx="16.5" cy="16.9" r="7.9" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="0.8"/>
  <g filter="url(#drop)">
    <path d="M11.2 13.2 H21.8 L16.5 21.6 Z" fill="url(#face)" stroke="#f0f0f0" stroke-width="0.6" stroke-linejoin="round"/>
  </g>
</svg>
