<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 33 33"
     g3d:name="icon_more" g3d:outputs="drawable-mdpi=33x33 drawable-hdpi=50x50">
  <!-- The selection bar's more: a grey ring lit from above with an arrow
       pointing down inside it. The ring is open: its middle is see-through,
       with the ring's shadow falling into it from the top edge. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="4.05" x2="0" y2="28.5">
      <stop offset="0" stop-color="rgb(230,230,230)"/>
      <stop offset="1" stop-color="rgb(168,168,168)"/>
    </linearGradient>
    <mask id="glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="33" height="33">
      <circle cx="16.505" cy="16.505" r="10.697" fill="none" stroke="#ffffff" stroke-width="5.091"/>
      <polygon fill="#ffffff" points="10.069,14.163 22.73,14.163 16.55,22.319"/>
    </mask>
    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="33" height="33">
      <circle cx="16.505" cy="16.505" r="8.145" fill="#ffffff"/>
    </mask>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.814"
                    flood-color="rgb(5.312,5.312,5.312)" flood-opacity="1"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.397"/>
    </filter>
  </defs>
  <g mask="url(#hole)">
    <circle cx="16.505" cy="16.475" r="8.145" fill="none" stroke="#000000" stroke-width="0.975"
            stroke-opacity="0.363" filter="url(#soft)"/>
  </g>
  <g filter="url(#drop)">
    <rect x="0" y="0" width="33" height="33" fill="url(#face)" mask="url(#glyph)"/>
  </g>
</svg>
