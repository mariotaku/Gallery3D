<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 100 94"
     g3d:name="btn_camera_pressed" g3d:outputs="drawable=100x94">
  <!-- The fallback folder's shutter button held down: btn_camera-small.svg's
       disc in solid gold with a narrower rim light and glow. -->
  <defs>
    <clipPath id="pane">
      <circle cx="104.275" cy="-12.541" r="72.066"/>
    </clipPath>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="60">
      <stop offset="0" stop-color="#fdce50"/>
      <stop offset="0.167" stop-color="#fdc643"/>
      <stop offset="0.283" stop-color="#fdbf36"/>
      <stop offset="0.517" stop-color="#fdb324"/>
      <stop offset="0.633" stop-color="#feaf19"/>
      <stop offset="0.75" stop-color="#ffaa0f"/>
      <stop offset="0.917" stop-color="#ffa60a"/>
      <stop offset="1" stop-color="#ffa60a"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-100" width="280" height="320"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9.325" result="spread"/>
      <feComponentTransfer in="spread" result="strength">
        <feFuncA type="linear" slope="1.716"/>
      </feComponentTransfer>
      <feFlood flood-color="#ffdd55"/>
      <feComposite in2="strength" operator="in"/>
    </filter>
    <filter id="rimLight" filterUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <feGaussianBlur stdDeviation="1.955"/>
    </filter>
    <path id="gloss" d="M 20 -20 L 30.75 -2 C 30 16 35.7 16.4 51.3 20.978 S 80 24.85 130 24.387 L 130 -20 Z"/>
    <clipPath id="glossy">
      <use href="#gloss"/>
    </clipPath>
    <g id="camera">
      <path d="M 62.019 11.4 H 67.305 V 12.8 L 62.019 15.55 Z"/>
      <path d="M 71.175 15 V 11.5 L 72.8 9.7 H 79.95 L 81.6 11.5 V 15 Z"/>
      <path d="M 69.5 13.5 H 91.675 V 35.7 H 61.2 V 17.562 Z"/>
    </g>
    <mask id="lens" maskUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <rect x="-20" y="-60" width="200" height="240" fill="#ffffff"/>
      <circle cx="76.55" cy="24.863" r="6.4" fill="none" stroke="#000000" stroke-width="2.38"/>
    </mask>
    <mask id="offCamera" maskUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <rect x="-20" y="-60" width="200" height="240" fill="#ffffff"/>
      <use href="#camera" fill="#000000"/>
      <circle cx="76.55" cy="24.863" r="6.4" fill="none" stroke="#ffffff" stroke-width="2.38"/>
    </mask>
    <filter id="cameraShadow" filterUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <feGaussianBlur stdDeviation="1.39"/>
    </filter>
  </defs>

  <circle cx="104.275" cy="-12.541" r="72.066" fill="#000000" filter="url(#glow)"/>
  <circle cx="104.275" cy="-12.541" r="72.066" fill="url(#gold)"/>
  <g clip-path="url(#pane)">
    <rect x="0" y="0" width="100" height="94" fill="#ffffff" opacity="0.14" clip-path="url(#glossy)"/>
    <circle cx="104.275" cy="-12.541" r="72.066" fill="none" stroke="rgb(100%,94%,66%)" stroke-width="6.056" opacity="0.839"
            filter="url(#rimLight)"/>
    <circle cx="104.275" cy="-12.541" r="70.917" fill="none" stroke="rgb(100%,94%,66%)" stroke-opacity="0.797" stroke-width="1.323"/>
  </g>

  <g mask="url(#offCamera)">
    <g opacity="0.357" filter="url(#cameraShadow)">
      <use href="#camera" transform="translate(0 1.566)" mask="url(#lens)"/>
    </g>
  </g>
  <circle cx="76.55" cy="24.863" r="6.4" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2.38"/>
  <use href="#camera" fill="#ffffff" fill-opacity="0.8" mask="url(#lens)"/>
</svg>
