<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 54 52"
     g3d:outputs="drawable=54x52">
  <!-- The check on a photo in selection mode: a rounded tile, filled with a
       gradient and edged with a rim, a lighter line along its top inside the
       rim, a band of shadow below it, and a check mark. -->
  <defs>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="0" y1="3.703" x2="0" y2="44.310">
      <stop offset="0" stop-color="rgb(0.000,210.000,8.000)"/>
      <stop offset="1" stop-color="rgb(0.000,107.000,35.750)"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="3.703" x2="0" y2="44.310">
      <stop offset="0" stop-color="rgb(131.500,258.000,116.500)"/>
      <stop offset="1" stop-color="rgb(133.500,258.000,113.000)"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.224"/>
    </filter>
    <filter id="band" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.400"/>
    </filter>
  </defs>
  <rect x="5.763" y="4.266" width="42.485" height="40.607" rx="8.037" fill="rgb(78.000,78.000,78.000)" opacity="0.353"
        filter="url(#band)"/>
  <rect x="5.763" y="3.703" width="42.485" height="40.607" rx="8.037" fill="url(#fill)" fill-opacity="1.000"/>
  <path d="M13.800 4.796 H40.211" stroke="rgb(56.000,56.000,56.000)" stroke-width="0.600"
        stroke-opacity="0.400"/>
  <rect x="6.609" y="4.550" width="40.792" height="38.914" rx="7.191" fill="none"
        stroke="url(#rim)" stroke-width="1.693" stroke-opacity="0.951"/>
  <path d="M14.900 23.650 L23.400 34.150 L41.137 14.075" fill="none" stroke="#000000" stroke-width="5.200"
        stroke-linecap="butt" stroke-linejoin="miter" transform="translate(0.031 2.575)" opacity="0.612" filter="url(#soft)"/>
  <path d="M14.900 23.650 L23.400 34.150 L41.137 14.075" fill="none" stroke="rgb(255.000,255.000,255.000)" stroke-width="5.200"
        stroke-linecap="butt" stroke-linejoin="miter" stroke-opacity="1.000"/>
</svg>
