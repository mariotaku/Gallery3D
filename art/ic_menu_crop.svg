<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 72 72"
     g3d:name="ic_menu_crop" g3d:outputs="drawable=72x72">
  <!-- Crop, in the Android 2.3 menu style: two crossed corner brackets around
       a portrait. Light grey faces with a darker bevel along their top edges,
       and a soft white glow around everything. Drawn in hdpi pixels. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="8.5" x2="0" y2="52">
      <stop offset="0" stop-color="rgb(255,255,255)"/>
      <stop offset="0.43" stop-color="rgb(255,255,255)"/>
      <stop offset="1" stop-color="rgb(214,214,214)"/>
    </linearGradient>
    <mask id="glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72">
      <g fill="#ffffff">
        <!-- Upper left bracket: its long upright and its crossbar. -->
        <rect x="16" y="10" width="7" height="44"/>
        <rect x="9" y="18" width="47" height="6"/>
        <!-- Lower right bracket. -->
        <rect x="49" y="18" width="7" height="44"/>
        <rect x="16" y="48" width="47" height="6"/>
        <!-- The portrait. -->
        <rect x="26.544" y="39.919" width="19.085" height="6.19" rx="1.15"/>
        <ellipse cx="36.094" cy="39.541" rx="5.031" ry="2.65" fill="#000000"/>
        <circle cx="36.094" cy="33.087" r="6.067"/>
      </g>
    </mask>
    <filter id="bevel" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.3" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.49"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feOffset in="SourceAlpha" dx="0.4" dy="1" result="shifted"/>
      <feComposite in="SourceAlpha" in2="shifted" operator="out" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="1.215" result="soft"/>
      <feFlood flood-color="rgb(51.875,51.875,51.875)" flood-opacity="0.925"/>
      <feComposite in2="soft" operator="in" result="tint"/>
      <feComposite in="tint" in2="SourceAlpha" operator="in" result="shade"/>
      <feMorphology in="SourceAlpha" operator="erode" radius="0.8" result="inner"/>
      <feComposite in="SourceAlpha" in2="inner" operator="out" result="rim"/>
      <feGaussianBlur in="rim" stdDeviation="0.15" result="softrim"/>
      <feFlood flood-color="rgb(170,170,170)" flood-opacity="0.509"/>
      <feComposite in2="softrim" operator="in" result="rimtint"/>
      <feComposite in="rimtint" in2="SourceAlpha" operator="in" result="rimshade"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="rimshade"/>
        <feMergeNode in="shade"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#bevel)">
    <rect x="0" y="0" width="72" height="72" fill="url(#face)" mask="url(#glyph)"/>
  </g>
</svg>
