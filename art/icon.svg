<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 48 48"
     g3d:outputs="drawable=48x48 drawable-mdpi=48x48 drawable-hdpi=72x72">
  <!-- The app's icon: a sunset print in a bevelled black frame. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4c4c"/>
      <stop offset="1" stop-color="#383838"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="0.5" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <radialGradient id="sky" cx="24" cy="28" r="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.28" stop-color="#ffe268"/>
      <stop offset="0.7" stop-color="#f2b31e"/>
      <stop offset="1" stop-color="#b86a00"/>
    </radialGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e3a22"/>
      <stop offset="1" stop-color="#0e0e0a"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <!-- The frame's four bevelled faces, lit from above. -->
    <path d="M3.6 4 H44.4 L39.7 8.7 H8.3 Z" fill="url(#top)"/>
    <path d="M3.6 4 L8.3 8.7 V39.7 L3.6 44.7 Z" fill="url(#side)"/>
    <path d="M44.4 4 V44.7 L39.7 39.7 V8.7 Z" fill="url(#side)"/>
    <path d="M3.6 44.7 L8.3 39.7 H39.7 L44.4 44.7 Z" fill="url(#bottom)"/>
  </g>
  <rect x="8.3" y="8.7" width="31.4" height="31" fill="url(#mat)"/>
  <rect x="9.6" y="10" width="28.8" height="28.4" fill="url(#sky)"/>
  <path d="M9.6 38.4 V29.8 Q11.4 27.6 13.4 27.9 Q15.4 28.2 16.6 26.9 Q18.2 25.6 20.2 27.3 Q22 28.9 24.2 27.6
           Q26.6 26.2 28.4 27.8 Q29.8 29 31.4 27.9 Q33.4 26.6 35.4 28.2 Q37 29.4 38.4 29.6 V38.4 Z" fill="url(#hills)"/>
  <rect x="9.6" y="10" width="28.8" height="28.4" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="0.5"/>
</svg>
