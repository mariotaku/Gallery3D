<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 53 51"
     g3d:outputs="drawable-mdpi=53x51">
  <!-- The play badge on a video: a smoked glass disc in a light ring that
       dims toward the bottom, a play triangle shaded the same way, and a soft
       glow around the ring. -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.087"/>
    </filter>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0" stop-color="rgb(239.500,239.500,239.500)"/>
      <stop offset="1" stop-color="rgb(176.750,176.750,176.750)"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(224.500,224.500,224.500)"/>
      <stop offset="1" stop-color="rgb(152.000,152.000,152.000)"/>
    </linearGradient>
  </defs>
  <circle cx="26.650" cy="25.500" r="22.000" fill="none" stroke="rgb(125.625,125.625,125.625)" stroke-width="5.112"
          opacity="0.300" filter="url(#glow)"/>
  <circle cx="26.650" cy="25.431" r="19.963" fill="#000000" opacity="0.436"/>
  <circle cx="26.650" cy="25.431" r="22.000" fill="none" stroke="url(#ring)" stroke-width="4.075" stroke-opacity="0.855"/>
  <path d="M18.850 14.300 L18.850 36.788 L38.075 25.244 Z" fill="url(#play)" fill-opacity="0.830"/>
</svg>
