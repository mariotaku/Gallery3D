<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 96 92"
     g3d:outputs="drawable=96x92 drawable-mdpi=53x51 drawable-hdpi=80x77">
  <!-- The play badge over a video's thumbnail: a smoked disc in a light ring,
       with a grey play triangle, lifted off the picture by a faint shadow. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ececec"/>
      <stop offset="1" stop-color="#acacac"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d4d4"/>
      <stop offset="1" stop-color="#a4a4a4"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <circle cx="47.6" cy="45.9" r="36" fill="#000000" fill-opacity="0.44"/>
    <circle cx="47.6" cy="45.9" r="39.3" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.9"/>
    <path d="M34 25.2 L67.2 46 L34 66.8 Z" fill="url(#play)" opacity="0.84"/>
  </g>
</svg>
