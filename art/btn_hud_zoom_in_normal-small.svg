  <g fill="rgb(88%,88%,88%)" opacity="0.777">
    <rect x="32.4" y="34.2" width="9.75" height="2.6"/>
    <rect x="36.6" y="31.15" width="2.6" height="9.75"/>
  </g>
  <circle cx="38.125" cy="35.765" r="8.537" fill="none" stroke="url(#catch)" stroke-width="0.3" opacity="0.1"/>
