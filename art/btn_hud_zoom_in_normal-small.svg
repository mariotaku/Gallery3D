<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 65 65"
     g3d:name="btn_hud_zoom_in_normal" g3d:outputs="drawable=43x43">
  <!-- The fallback drawable's zoom in key, drawn like btn_hud_zoom_in_normal.svg
       in hdpi pixels. Its older art has a slightly different glass and glyph. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="9.156" y1="0" x2="65" y2="0">
      <stop offset="0" stop-color="rgb(27.5%,27.5%,27.5%)"/>
      <stop offset="1" stop-color="rgb(83%,83%,83%)"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(93%,93%,93%)"/>
      <stop offset="1" stop-color="rgb(87%,87%,87%)"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="key">
      <rect x="9.156" y="9.219" width="80" height="80" rx="7.25"/>
    </clipPath>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <rect x="-20" y="-20" width="120" height="120" fill="#ffffff"/>
      <rect x="9.156" y="9.219" width="80" height="80" rx="7.25" fill="#000000"/>
    </mask>
    <mask id="notGlyph" maskUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <rect x="-20" y="-20" width="120" height="120" fill="#ffffff"/>
      <use href="#glyph" fill="#000000" stroke="#000000"/>
    </mask>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="2.594"/>
    </filter>
    <g id="glyph">
      <circle cx="38.125" cy="35.765" r="8.537" fill="none" stroke-width="4.75"/>
      <line x1="46.6" y1="43.65" x2="53.3" y2="50.25" stroke-width="5.966" stroke-linecap="round"/>
      <rect x="32.4" y="34.2" width="9.75" height="2.6" stroke="none"/>
      <rect x="36.6" y="31.15" width="2.6" height="9.75" stroke="none"/>
    </g>
  </defs>

  <g mask="url(#outside)">
    <rect x="9.156" y="9.219" width="80" height="80" rx="7.25" fill="#000000" opacity="0.749" filter="url(#shadow)"/>
  </g>
  <g mask="url(#notGlyph)">
    <rect x="9.156" y="9.219" width="80" height="80" rx="7.25" fill="url(#face)" fill-opacity="0.41"/>
    <g clip-path="url(#key)">
      <rect x="9.156" y="9.219" width="80" height="80" rx="7.25" fill="none" stroke="rgb(55%,55%,55%)"
