      <rect x="0" y="63.6" width="65" height="0.3" fill="#000000" opacity="0.405"/>
    </g>
    <circle cx="38.125" cy="35.765" r="6.662" fill="#000000" opacity="0.003"/>
    <use href="#glyph" fill="#000000" stroke="#000000" opacity="0.588" filter="url(#edge)"/>
  </g>
  <circle cx="38.125" cy="35.765" r="8.537" fill="none" stroke="url(#ring)" stroke-width="4.75" opacity="0.748"/>
  <line x1="46.6" y1="43.65" x2="53.3" y2="50.25" stroke="url(#ring)" stroke-width="5.966" stroke-linecap="round"
