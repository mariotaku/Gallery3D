<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 30 30"
     g3d:name="icon_delete" g3d:outputs="drawable-hdpi=45x45">
  <!-- The selection bar's delete at hdpi, drawn in mdpi units: a grey bin lit
       from above. The slots, the groove under the lid and the space inside the
       handle are cut through and tinted dark. It casts a tight shadow over a
       wider, fainter one. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="4.633" x2="0" y2="27.181">
      <stop offset="0" stop-color="rgb(231,231,231)"/>
      <stop offset="1" stop-color="rgb(168,168,168)"/>
    </linearGradient>
    <mask id="bin" maskUnits="userSpaceOnUse" x="0" y="0" width="30" height="30">
      <rect fill="#ffffff" x="10.331" y="4.467" width="9.278" height="5" rx="2.438"/>
      <rect fill="#000000" x="12.474" y="6.687" width="5.076" height="3" rx="0.3"/>
      <rect fill="#ffffff" x="5.434" y="7.902" width="18.987" height="3.461"/>
      <polygon fill="#ffffff" points="7.866,12.068 22.225,12.068 22.082,26.05 7.762,26.05"/>
      <g fill="#000000">
        <rect x="10.575" y="14.613" width="1.5" height="9.05"/>
        <rect x="14.3" y="14.613" width="1.5" height="9.05"/>
        <rect x="18.025" y="14.613" width="1.5" height="9.05"/>
      </g>
    </mask>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.949"/>
      <feOffset dx="0" dy="0.5" result="nb"/>
      <feColorMatrix in="nb" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.25  0 0 0 0 0.25  0 0 0 0.841 0" result="near"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.136"/>
      <feOffset dx="0" dy="0.568" result="fb"/>
      <feColorMatrix in="fb" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.25  0 0 0 0 0.25  0 0 0 0.493 0" result="far"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="0" y="0" width="30" height="30" fill="url(#face)" mask="url(#bin)"/>
  </g>
  <g fill="rgb(85.307,85.307,85.307)" fill-opacity="0.119">
    <rect x="10.575" y="14.613" width="1.5" height="9.05"/>
    <rect x="14.3" y="14.613" width="1.5" height="9.05"/>
    <rect x="18.025" y="14.613" width="1.5" height="9.05"/>
    <rect x="12.474" y="6.687" width="5.06" height="0.504"/>
    <rect x="5.434" y="11.629" width="18.987" height="0.699"/>
  </g>
</svg>
