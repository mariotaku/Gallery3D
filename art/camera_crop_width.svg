<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 38 38"
     g3d:outputs="drawable=38x38">
  <!-- The crop box's handle for its left and right edges: the same knob as
       camera_crop_height, with a left and right arrow. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8a8a"/>
      <stop offset="0.3" stop-color="#262626"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="face" cx="0.45" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#c6c6c6"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c6c6c"/>
      <stop offset="1" stop-color="#2c2c2c"/>
    </linearGradient>
    <filter id="drop" filterUnits="userSpaceOnUse" x="-5" y="-5" width="48" height="48">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>
  <circle cx="20" cy="17" r="16" fill="url(#ring)" filter="url(#drop)"/>
  <circle cx="20" cy="17" r="14" fill="url(#face)"/>
  <path d="M11 17 L17.3 11.6 V15 H22.7 V11.6 L29 17 L22.7 22.4 V19 H17.3 V22.4 Z" fill="url(#arrow)"/>
</svg>
