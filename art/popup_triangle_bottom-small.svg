<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 43 28"
     g3d:name="popup_triangle_bottom" g3d:outputs="drawable=43x28">
  <!-- The fallback folder's point under a popup, a little wider than mdpi's,
       under the tighter popup.9-small.svg border. -->
  <defs>
    <path id="glass" d="M -20 -10 H 63 V 1.45 H 35.7 L 21.5 15.8 L 7.3 1.45 H -20 Z"/>
    <path id="line" d="M -20 1.45 H 7.3 L 21.5 15.8 L 35.7 1.45 H 63" fill="none" stroke-width="1.95"/>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="130" height="110">
      <feGaussianBlur stdDeviation="3.6"/>
    </filter>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-40" y="-40" width="130" height="110">
      <rect x="-40" y="-40" width="130" height="110" fill="#ffffff"/>
      <use href="#glass" fill="#000000"/>
      <use href="#line" stroke="#000000"/>
    </mask>
  </defs>
  <g mask="url(#outside)">
    <g transform="translate(0 4)" filter="url(#shadow)" opacity="0.85">
      <use href="#glass" fill="#000000"/>
      <use href="#line" stroke="#000000"/>
    </g>
  </g>
  <use href="#glass" fill="#262626" fill-opacity="0.9"/>
  <use href="#line" stroke="#ffffff"/>
</svg>
