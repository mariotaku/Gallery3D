<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 150 140"
     g3d:name="mode_grid" g3d:outputs="drawable=100x94">
  <!-- The fallback drawable's grid switch, drawn like mode_grid.svg in hdpi
       pixels. Its older art sits a little differently at 100 by 94. -->
  <defs>
    <g id="squares" transform="translate(-0.05 -0.025)">
      <rect x="7.3" y="19.8" width="5.1" height="4.2"/>
      <rect x="15.6" y="19.8" width="5" height="4.2"/>
      <rect x="23.75" y="19.8" width="5" height="4.2"/>
      <rect x="32.3" y="19.8" width="5.05" height="4.2"/>
      <rect x="7.3" y="26.55" width="5.1" height="4.3"/>
      <rect x="15.6" y="26.55" width="5" height="4.3"/>
      <rect x="23.75" y="26.55" width="5" height="4.3"/>
      <rect x="32.3" y="26.55" width="5.05" height="4.3"/>
      <rect x="7.3" y="34.45" width="5.1" height="4.15"/>
      <rect x="15.6" y="34.45" width="5" height="4.15"/>
      <rect x="23.75" y="34.45" width="5" height="4.15"/>
      <rect x="32.3" y="34.45" width="5.05" height="4.15"/>
    </g>
    <rect id="track" x="45.847" y="16.564" width="57.95" height="24.262" rx="11.631"/>
    <circle id="knob" cx="58.11" cy="28.627" r="9.9"/>
    <path id="back" transform="translate(0.031 -0.289)" d="M 121 23.5 L 143.2 24.2 L 142.6 39.9 L 120.4 39.2 Z"/>
    <path id="front" transform="translate(0.031 -0.289)" d="M 112.9 20.35 L 134.3 16.65 L 136.6 32.35 L 115.2 36.05 Z"/>
    <clipPath id="clipBack">
      <use href="#back"/>
    </clipPath>
    <radialGradient id="knobGlass" gradientUnits="userSpaceOnUse" cx="64.476" cy="17.023" r="17.689">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(100%,100%,100%)" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="blurSquares" filterUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <feGaussianBlur stdDeviation="3.1"/>
    </filter>
    <filter id="blurTrack" filterUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <feGaussianBlur stdDeviation="1.326"/>
    </filter>
    <filter id="blurKnob" filterUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <feGaussianBlur stdDeviation="1.491"/>
    </filter>
    <filter id="blurPhotos" filterUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <feGaussianBlur stdDeviation="2.097"/>
    </filter>
    <mask id="notSquares" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#squares" fill="#000000"/>
    </mask>
    <mask id="notTrack" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#track" fill="none" stroke="#000000" stroke-width="3.309"/>
    </mask>
    <mask id="notKnob" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#knob" fill="#000000"/>
    </mask>
    <mask id="notPhotos" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#back" fill="#000000"/>
      <use href="#front" fill="#000000"/>
    </mask>
    <mask id="notFront" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#front" fill="#000000"/>
    </mask>
    <mask id="backVisible" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#front" fill="#000000" stroke="#000000" stroke-width="3.897" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g mask="url(#notSquares)">
    <use href="#squares" transform="translate(0 1.219)" fill="#000000" opacity="0.74" filter="url(#blurSquares)"/>
  </g>
  <use href="#squares" fill="#fcfcfc" fill-opacity="0.95"/>

  <g mask="url(#notTrack)">
    <use href="#track" fill="none" stroke="#000000" stroke-width="3.309" opacity="0.992" filter="url(#blurTrack)"/>
  </g>
  <use href="#track" fill="none" stroke="#ffffff" stroke-opacity="0.502" stroke-width="3.309"/>

  <g mask="url(#notKnob)">
    <use href="#knob" transform="translate(-0.038 0.018)" fill="#000000" opacity="0.85" filter="url(#blurKnob)"/>
  </g>
  <use href="#knob" fill="url(#knobGlass)"/>

  <g mask="url(#notPhotos)">
    <g transform="translate(0 -0.006)" fill="#000000" opacity="0.967" filter="url(#blurPhotos)">
      <use href="#back"/>
      <use href="#front"/>
    </g>
  </g>
  <g clip-path="url(#clipBack)">
    <g mask="url(#notFront)">
      <use href="#front" transform="translate(0 -0.006)" fill="#000000" opacity="0.955" filter="url(#blurPhotos)"/>
    </g>
  </g>
  <use href="#back" fill="#ffffff" fill-opacity="0.9" mask="url(#backVisible)"/>
  <use href="#front" fill="#ffffff" fill-opacity="0.9"/>
</svg>
