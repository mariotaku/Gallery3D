<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 163 48"
     g3d:outputs="drawable-mdpi=163x48 drawable-hdpi=244x72">
  <!-- scroller_new while dragged: the pill in solid gold, deeper below the
       middle, lit from inside along its edge and glowing yellow around, with
       dark grip dots and a white arrow with a brown halo at each end.
       scroller_pressed_new-small.svg is the fallback folder's. -->
  <defs>
    <rect id="pill" x="11.255" y="12.845" width="139.7" height="34.312" rx="11.213" ry="16.794"/>
    <clipPath id="inside">
      <use href="#pill"/>
    </clipPath>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="12.845" x2="0" y2="47.147">
      <stop offset="0.01" stop-color="#fde485"/>
      <stop offset="0.221" stop-color="#fdd66b"/>
      <stop offset="0.279" stop-color="#fed365"/>
      <stop offset="0.375" stop-color="#fdcc58"/>
      <stop offset="0.471" stop-color="#fdc64c"/>
      <stop offset="0.548" stop-color="#fec142"/>
      <stop offset="0.567" stop-color="#febb33"/>
      <stop offset="0.606" stop-color="#feb729"/>
      <stop offset="0.702" stop-color="#feb11c"/>
      <stop offset="0.798" stop-color="#ffab13"/>
      <stop offset="1" stop-color="#ffa40a"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="spread"/>
      <feComponentTransfer in="spread" result="strength">
        <feFuncA type="linear" slope="1.698"/>
      </feComponentTransfer>
      <feFlood flood-color="#ffdc54"/>
      <feComposite in2="strength" operator="in"/>
    </filter>
    <filter id="light" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="1.825" flood-color="rgb(23.125%,12.75%,1%)" flood-opacity="0.489"/>
    </filter>
    <g id="dots">
      <rect x="0" y="0" width="2.925" height="2.2"/>
      <rect x="8.75" y="0" width="2.925" height="2.2"/>
      <rect x="17.5" y="0" width="2.925" height="2.2"/>
      <rect x="26.25" y="0" width="2.925" height="2.2"/>
      <rect x="35" y="0" width="2.925" height="2.2"/>
      <rect x="43.75" y="0" width="2.925" height="2.2"/>
      <rect x="52.5" y="0" width="2.925" height="2.2"/>
      <rect x="61.25" y="0" width="2.925" height="2.2"/>
      <rect x="70" y="0" width="2.925" height="2.2"/>
    </g>
    <path id="arrow" d="M 21.441 31.42 L 32.082 25.337 V 37.674 Z"/>
  </defs>
  <use href="#pill" fill="#000000" filter="url(#glow)"/>
  <use href="#pill" fill="url(#gold)"/>
  <g clip-path="url(#inside)">
    <use href="#pill" fill="none" stroke="rgb(100%,95.3%,71.4%)" stroke-width="5.966" opacity="0.958" filter="url(#light)"/>
    <use href="#pill" fill="none" stroke="rgb(100%,94%,64.875%)" stroke-opacity="0.875" stroke-width="1.4"/>
  </g>
  <g fill="#000000" fill-opacity="0.199">
    <use href="#dots" transform="translate(44.67 22.1)"/>
    <use href="#dots" transform="translate(44.67 29.2)"/>
    <use href="#dots" transform="translate(44.67 37)"/>
  </g>
  <g filter="url(#halo)" fill="#ffffff" fill-opacity="0.522">
    <use href="#arrow"/>
    <use href="#arrow" transform="translate(163 0) scale(-1 1)"/>
  </g>
</svg>
