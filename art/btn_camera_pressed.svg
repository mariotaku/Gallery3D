<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 150 150"
     g3d:outputs="drawable-mdpi=100x100 drawable-hdpi=150x150">
  <!-- The shutter button held down: btn_camera.svg's disc in solid gold,
       deeper toward the bottom, lighter above the gloss line, lit from inside
       along its rim and glowing yellow far past it, with the same white
       camera. The fallback folder's is btn_camera_pressed-small.svg. -->
  <defs>
    <clipPath id="pane">
      <circle cx="157.337" cy="-19.795" r="115.241"/>
    </clipPath>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="110">
      <stop offset="0" stop-color="#fdce53"/>
      <stop offset="0.164" stop-color="#fdc440"/>
      <stop offset="0.364" stop-color="#feb92d"/>
      <stop offset="0.518" stop-color="#feb11c"/>
      <stop offset="0.682" stop-color="#ffa80c"/>
      <stop offset="1" stop-color="#ffa80c"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-100" width="280" height="320"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="23.025" result="spread"/>
      <feComponentTransfer in="spread" result="strength">
        <feFuncA type="linear" slope="1.716"/>
      </feComponentTransfer>
      <feFlood flood-color="#ffdc54"/>
      <feComposite in2="strength" operator="in"/>
    </filter>
    <filter id="rimLight" filterUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <feGaussianBlur stdDeviation="3.938"/>
    </filter>
    <path id="gloss" d="M 30 -20 L 42.25 -2 C 42 28 57.525 30.2 79.562 35.5 S 140 39 180 40.625 L 180 -20 Z"/>
    <clipPath id="glossy">
      <use href="#gloss"/>
    </clipPath>
    <g id="camera">
      <path d="M 89.438 19.25 H 98.075 V 20.7 L 89.438 24.919 Z"/>
      <path d="M 104.9 24 V 20.1 L 107.312 16.737 H 118.5 L 120.35 20.1 V 24 Z"/>
      <path d="M 99.725 22.5 H 136.5 V 55.5 H 88.45 V 27.75 Z"/>
    </g>
    <mask id="lens" maskUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <rect x="-20" y="-60" width="200" height="240" fill="#ffffff"/>
      <circle cx="112.506" cy="40.375" r="9.986" fill="none" stroke="#000000" stroke-width="4.088"/>
    </mask>
    <mask id="offCamera" maskUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <rect x="-20" y="-60" width="200" height="240" fill="#ffffff"/>
      <use href="#camera" fill="#000000"/>
      <circle cx="112.506" cy="40.375" r="9.986" fill="none" stroke="#ffffff" stroke-width="4.088"/>
    </mask>
    <filter id="cameraShadow" filterUnits="userSpaceOnUse" x="-20" y="-60" width="200" height="240">
      <feGaussianBlur stdDeviation="3.862"/>
    </filter>
  </defs>

  <circle cx="157.337" cy="-19.795" r="115.241" fill="#000000" filter="url(#glow)"/>
  <circle cx="157.337" cy="-19.795" r="115.241" fill="url(#gold)"/>
  <g clip-path="url(#pane)">
    <rect x="0" y="0" width="150" height="150" fill="#ffffff" opacity="0.136" clip-path="url(#glossy)"/>
    <circle cx="157.337" cy="-19.795" r="115.241" fill="none" stroke="rgb(100%,94%,66%)" stroke-width="15.67" opacity="0.782"
            filter="url(#rimLight)"/>
    <circle cx="157.337" cy="-19.795" r="112.594" fill="none" stroke="rgb(100%,94%,66%)" stroke-opacity="0.972" stroke-width="3.181"/>
  </g>

  <g mask="url(#offCamera)">
    <g opacity="0.539" filter="url(#cameraShadow)">
      <use href="#camera" transform="translate(0 3.881)" mask="url(#lens)"/>
    </g>
  </g>
  <circle cx="112.506" cy="40.375" r="9.986" fill="none" stroke="#000000" stroke-opacity="0.125" stroke-width="4.088"/>
  <use href="#camera" fill="#ffffff" fill-opacity="0.8" mask="url(#lens)"/>
</svg>
