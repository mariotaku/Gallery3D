<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 21 39" width="21" height="39"
     g3d:outputs="drawable=21x39">
  <!-- Where one crumb meets the next: a chevron cut through
       art/templates/capsule.svg's straight middle, the glass moved up two
       pixels. Each side of the cut carries the capsule's edge at the width it
       has halfway round an end, 0.75, and the shadow falls into the cut. Both
       edge columns are pathbar_bg's. -->
  <defs>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="33">
      <stop offset="0.02" stop-color="#fdfdfd" stop-opacity="0.267"/>
      <stop offset="0.30" stop-color="#eeeeee" stop-opacity="0.243"/>
      <stop offset="0.54" stop-color="#dedede" stop-opacity="0.204"/>
      <stop offset="0.58" stop-color="#d6d6d6" stop-opacity="0.180"/>
      <stop offset="0.62" stop-color="#cdcdcd" stop-opacity="0.161"/>
      <stop offset="0.78" stop-color="#bebebe" stop-opacity="0.133"/>
      <stop offset="0.98" stop-color="#b1b1b1" stop-opacity="0.110"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="33">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bdbdbd" stop-opacity="0.2"/>
    </linearGradient>
    <path id="left" d="M -60 5 H 6.89 L 15.5 19.2 L 6.79 33 H -60 Z"/>
    <path id="right" d="M 80 5 H 9.69 L 18.3 19.2 L 9.59 33 H 80 Z"/>
    <clipPath id="inLeft">
      <use href="#left"/>
    </clipPath>
    <clipPath id="inRight">
      <use href="#right"/>
    </clipPath>
    <!-- The edge band inside either piece: 0.75 along the cut, from a stroke
         twice as wide with its outer half clipped away, and the bar's own
         rows along the top and bottom. -->
    <mask id="bandLeft" maskUnits="userSpaceOnUse" x="-80" y="-10" width="180" height="60">
      <g clip-path="url(#inLeft)">
        <use href="#left" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <rect x="-60" y="5" width="140" height="0.5" fill="#ffffff"/>
        <rect x="-60" y="32" width="140" height="1" fill="#ffffff"/>
      </g>
    </mask>
    <mask id="bandRight" maskUnits="userSpaceOnUse" x="-80" y="-10" width="180" height="60">
      <g clip-path="url(#inRight)">
        <use href="#right" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <rect x="-60" y="5" width="140" height="0.5" fill="#ffffff"/>
        <rect x="-60" y="32" width="140" height="1" fill="#ffffff"/>
      </g>
    </mask>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-80" y="-10" width="180" height="60">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-80" y="-10" width="180" height="60">
      <rect x="-80" y="-10" width="180" height="60" fill="#ffffff"/>
      <use href="#left" fill="#000000"/>
      <use href="#right" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#outside)">
    <g transform="translate(0 -0.25)" fill="#000000" opacity="0.205" filter="url(#shadow)">
      <use href="#left"/>
      <use href="#right"/>
    </g>
  </g>
  <use href="#left" fill="url(#glass)"/>
  <use href="#right" fill="url(#glass)"/>
  <g mask="url(#bandLeft)">
    <rect x="-60" y="0" width="140" height="39" fill="url(#edge)"/>
  </g>
  <g mask="url(#bandRight)">
    <rect x="-60" y="0" width="140" height="39" fill="url(#edge)"/>
  </g>
</svg>
