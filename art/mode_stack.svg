<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 150 140"
     g3d:outputs="drawable=100x94 drawable-mdpi=100x93 drawable-hdpi=150x140">
  <!-- mode_grid.svg's switch set to the stacks: the knob sits at the pile's
       end of the track. -->
  <defs>
    <g id="squares">
      <rect x="7.3" y="19.8" width="5.1" height="4.2"/>
      <rect x="15.6" y="19.8" width="5" height="4.2"/>
      <rect x="23.75" y="19.8" width="5" height="4.2"/>
      <rect x="32.3" y="19.8" width="5.05" height="4.2"/>
      <rect x="7.3" y="26.55" width="5.1" height="4.3"/>
      <rect x="15.6" y="26.55" width="5" height="4.3"/>
      <rect x="23.75" y="26.55" width="5" height="4.3"/>
      <rect x="32.3" y="26.55" width="5.05" height="4.3"/>
      <rect x="7.3" y="34.45" width="5.1" height="4.15"/>
      <rect x="15.6" y="34.45" width="5" height="4.15"/>
      <rect x="23.75" y="34.45" width="5" height="4.15"/>
      <rect x="32.3" y="34.45" width="5.05" height="4.15"/>
    </g>
    <rect id="track" x="46.85" y="16.95" width="56.9" height="24.2" rx="12.1"/>
    <circle id="knob" cx="90.75" cy="29" r="9.8"/>
    <path id="back" d="M 121 23.5 L 143.2 24.2 L 142.6 39.9 L 120.4 39.2 Z"/>
    <path id="front" d="M 112.9 20.35 L 134.3 16.65 L 136.6 32.35 L 115.2 36.05 Z"/>
    <clipPath id="clipBack">
      <use href="#back"/>
    </clipPath>
    <radialGradient id="knobGlass" gradientUnits="userSpaceOnUse" cx="98.5" cy="17" r="18">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="blur16" filterUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="blur13" filterUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="blur09" filterUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <mask id="notSquares" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#squares" fill="#000000"/>
    </mask>
    <mask id="notTrack" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#track" fill="none" stroke="#000000" stroke-width="3.3"/>
    </mask>
    <mask id="notKnob" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#knob" fill="#000000"/>
    </mask>
    <mask id="notPhotos" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#back" fill="#000000"/>
      <use href="#front" fill="#000000"/>
    </mask>
    <mask id="notFront" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#front" fill="#000000"/>
    </mask>
    <mask id="backVisible" maskUnits="userSpaceOnUse" x="-20" y="-20" width="190" height="90">
      <rect x="-20" y="-20" width="190" height="90" fill="#ffffff"/>
      <use href="#front" fill="#000000" stroke="#000000" stroke-width="3.4" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g mask="url(#notSquares)">
    <use href="#squares" transform="translate(0 0.5)" fill="#000000" opacity="0.6" filter="url(#blur16)"/>
  </g>
  <use href="#squares" fill="#fcfcfc" fill-opacity="0.86"/>

  <g mask="url(#notTrack)">
    <use href="#track" fill="none" stroke="#000000" stroke-width="3.3" opacity="0.7" filter="url(#blur13)"/>
  </g>
  <use href="#track" fill="none" stroke="#ffffff" stroke-opacity="0.52" stroke-width="3.3"/>

  <g mask="url(#notKnob)">
    <use href="#knob" transform="translate(-0.6 0)" fill="#000000" opacity="0.85" filter="url(#blur09)"/>
  </g>
  <use href="#knob" fill="url(#knobGlass)"/>

  <g mask="url(#notPhotos)">
    <g transform="translate(0 0.5)" fill="#000000" opacity="0.5" filter="url(#blur16)">
      <use href="#back"/>
      <use href="#front"/>
    </g>
  </g>
  <g clip-path="url(#clipBack)">
    <g mask="url(#notFront)">
      <use href="#front" transform="translate(0 0.5)" fill="#000000" opacity="0.9" filter="url(#blur16)"/>
    </g>
  </g>
  <use href="#back" fill="#ffffff" fill-opacity="0.9" mask="url(#backVisible)"/>
  <use href="#front" fill="#ffffff" fill-opacity="0.9"/>
</svg>
