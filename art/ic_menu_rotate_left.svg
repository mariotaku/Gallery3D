<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 72 72"
     g3d:name="ic_menu_rotate_left" g3d:outputs="drawable=72x72">
  <!-- Turns the photo a quarter to the left, in the Android 2.3 menu style: a
       broad ring around a sunken dot, open on the left, starting from a
       pointed tail at the lower left and ending in a right-angled arrowhead
       at the upper left. Light grey with a darker bevel along its edges and a
       soft white glow. Drawn in hdpi pixels. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="27.252" x2="0" y2="55.053">
      <stop offset="0" stop-color="rgb(255,255,255)"/>
      <stop offset="1" stop-color="rgb(208.75,208.75,208.75)"/>
    </linearGradient>
    <linearGradient id="dot" gradientUnits="userSpaceOnUse" x1="0" y1="26.15" x2="0" y2="39.1">
      <stop offset="0" stop-color="rgb(168,168,168)"/>
      <stop offset="1" stop-color="rgb(255,255,255)"/>
    </linearGradient>
    <mask id="ring" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72">
      <circle cx="35.632" cy="35.6" r="22.019" fill="none" stroke="#ffffff" stroke-width="8.67"/>
      <polygon fill="#000000" points="35.632,35.6 8.875,25.5 -1.907,62.062 16.766,43.5"/>
      <polygon fill="#ffffff" points="10.288,13.109 10.288,30.513 29.3,28.75"/>
      <!-- The tail tapers to a point where the ring starts. -->
      <polygon fill="#ffffff" points="16.429,43.5 16.3,43.4 17,44.379"/>
    </mask>
    <filter id="bevel" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.625"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMorphology in="SourceAlpha" operator="erode" radius="1" result="inner"/>
      <feComposite in="SourceAlpha" in2="inner" operator="out" result="rim"/>
      <feGaussianBlur in="rim" stdDeviation="0.659" result="softrim"/>
      <feFlood flood-color="rgb(39.218,39.218,39.218)" flood-opacity="0.644"/>
      <feComposite in2="softrim" operator="in" result="tint"/>
      <feComposite in="tint" in2="SourceAlpha" operator="in" result="shade"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shade"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#bevel)">
    <rect x="0" y="0" width="72" height="72" fill="url(#face)" mask="url(#ring)"/>
    <circle cx="35.995" cy="35.779" r="5.173" fill="url(#dot)"/>
  </g>
</svg>
