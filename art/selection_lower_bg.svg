<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 1 58"
     g3d:outputs="drawable=1x58">
  <!-- The same smoked glass as selection_menu_bg, for a bar along the bottom. -->
  <defs>
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="12">
      <stop offset="0.042" stop-color="#000000" stop-opacity="0.008"/>
      <stop offset="0.292" stop-color="#000000" stop-opacity="0.031"/>
      <stop offset="0.542" stop-color="#000000" stop-opacity="0.075"/>
      <stop offset="0.792" stop-color="#000000" stop-opacity="0.141"/>
      <stop offset="0.958" stop-color="#000000" stop-opacity="0.192"/>
    </linearGradient>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="0" y1="13" x2="0" y2="58">
      <stop offset="0.011" stop-color="#000000" stop-opacity="0.302"/>
      <stop offset="0.167" stop-color="#000000" stop-opacity="0.333"/>
      <stop offset="0.389" stop-color="#000000" stop-opacity="0.404"/>
      <stop offset="0.656" stop-color="#000000" stop-opacity="0.502"/>
      <stop offset="0.989" stop-color="#000000" stop-opacity="0.596"/>
    </linearGradient>
  </defs>
  <rect x="-1" y="0" width="3" height="12" fill="url(#shade)"/>
  <rect x="-1" y="12" width="3" height="1" fill="#747474" fill-opacity="0.47"/>
