<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 163 48"
     g3d:name="scroller_pressed_new" g3d:outputs="drawable=163x48">
  <!-- The fallback folder's handle while dragged: gold, lit from inside along
       its top and sides, and glowing around. -->
  <defs>
    <path id="tab" d="M 13.4 60 V 18.4 A 5 5 0 0 1 18.4 13.4 H 144.6 A 5 5 0 0 1 149.6 18.4 V 60 Z"/>
    <clipPath id="inside">
      <use href="#tab"/>
    </clipPath>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="13.4" x2="0" y2="48">
      <stop offset="0.205" stop-color="#fcd973"/>
      <stop offset="0.32" stop-color="#fdd56a"/>
      <stop offset="0.436" stop-color="#fdd05f"/>
      <stop offset="0.552" stop-color="#fdca53"/>
      <stop offset="0.565" stop-color="#fdc950"/>
      <stop offset="0.566" stop-color="#fdc542"/>
      <stop offset="0.668" stop-color="#fdbf3a"/>
      <stop offset="0.783" stop-color="#feb92d"/>
      <stop offset="0.899" stop-color="#feb321"/>
      <stop offset="0.986" stop-color="#feaf19"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="spread"/>
      <feComponentTransfer in="spread" result="strength">
        <feFuncA type="linear" slope="1.65"/>
      </feComponentTransfer>
      <feFlood flood-color="#ffdc54"/>
      <feComposite in2="strength" operator="in"/>
    </filter>
    <filter id="light" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="emboss" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#8a6000" flood-opacity="0.5"/>
    </filter>
    <g id="dots">
      <rect x="-1.3" y="0" width="2.6" height="2.6"/>
      <rect x="7.45" y="0" width="2.6" height="2.6"/>
      <rect x="16.2" y="0" width="2.6" height="2.6"/>
      <rect x="24.95" y="0" width="2.6" height="2.6"/>
      <rect x="33.7" y="0" width="2.6" height="2.6"/>
      <rect x="42.45" y="0" width="2.6" height="2.6"/>
      <rect x="51.2" y="0" width="2.6" height="2.6"/>
      <rect x="59.95" y="0" width="2.6" height="2.6"/>
      <rect x="68.7" y="0" width="2.6" height="2.6"/>
    </g>
  </defs>
  <use href="#tab" fill="#000000" filter="url(#glow)"/>
  <use href="#tab" fill="url(#gold)"/>
  <g clip-path="url(#inside)">
    <use href="#tab" fill="none" stroke="#fff3b3" stroke-width="8" filter="url(#light)"/>
    <use href="#tab" fill="none" stroke="#fff6c4" stroke-width="2"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.08">
    <use href="#dots" transform="translate(47.5 23.4)"/>
    <use href="#dots" transform="translate(47.5 30.5)"/>
    <use href="#dots" transform="translate(47.5 38.4)"/>
  </g>
  <g fill="#000000" fill-opacity="0.29">
    <use href="#dots" transform="translate(47.5 21.9)"/>
    <use href="#dots" transform="translate(47.5 29)"/>
    <use href="#dots" transform="translate(47.5 36.9)"/>
  </g>
  <g filter="url(#emboss)" fill="#fff4d0" fill-opacity="0.65">
    <path d="M 21 30.75 L 32 25 V 36.5 Z"/>
    <path d="M 142 30.75 L 131 25 V 36.5 Z"/>
  </g>
</svg>
