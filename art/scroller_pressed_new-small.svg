<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 163 64"
     g3d:name="scroller_pressed_new" g3d:outputs="drawable=163x64">
  <!-- The fallback folder's handle while dragged: scroller_new-small.svg's tab
       in solid gold, deeper below the middle, lit from inside along its top
       and sides and glowing yellow around, with dark grip dots and a white
       arrow with a brown halo at each end. Like scroller_new-small.svg, the
       tab and its glow fade out over the canvas's last 16 rows, below the 48
       the time bar lays out. -->
  <defs>
    <rect id="tab" x="13.406" y="13.595" width="136.213" height="60" rx="7.613"/>
    <clipPath id="inside">
      <use href="#tab"/>
    </clipPath>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="13" x2="0" y2="48">
      <stop offset="0" stop-color="#fde290"/>
      <stop offset="0.186" stop-color="#fcdc7b"/>
      <stop offset="0.357" stop-color="#fdd568"/>
      <stop offset="0.414" stop-color="#fdd161"/>
      <stop offset="0.557" stop-color="#fecb55"/>
      <stop offset="0.586" stop-color="#fdc542"/>
      <stop offset="0.643" stop-color="#fec13d"/>
      <stop offset="0.7" stop-color="#febe36"/>
      <stop offset="0.786" stop-color="#feb92d"/>
      <stop offset="0.957" stop-color="#feb01c"/>
      <stop offset="1" stop-color="#feaf19"/>
    </linearGradient>
    <linearGradient id="fadeOut" gradientUnits="userSpaceOnUse" x1="0" y1="48" x2="0" y2="64">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="144">
      <rect x="-40" y="-40" width="250" height="144" fill="url(#fadeOut)"/>
    </mask>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="144"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.65" result="spread"/>
      <feComponentTransfer in="spread" result="strength">
        <feFuncA type="linear" slope="1.662"/>
      </feComponentTransfer>
      <feFlood flood-color="#ffdb4e"/>
      <feComposite in2="strength" operator="in"/>
    </filter>
    <filter id="light" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="144">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="144"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="1.522" flood-color="rgb(25.375%,19.5%,4%)" flood-opacity="0.5"/>
    </filter>
    <g id="dots">
      <rect x="0" y="0" width="2.3" height="2.512"/>
      <rect x="8.75" y="0" width="2.3" height="2.512"/>
      <rect x="17.5" y="0" width="2.3" height="2.512"/>
      <rect x="26.25" y="0" width="2.3" height="2.512"/>
      <rect x="35" y="0" width="2.3" height="2.512"/>
      <rect x="43.75" y="0" width="2.3" height="2.512"/>
      <rect x="52.5" y="0" width="2.3" height="2.512"/>
      <rect x="61.25" y="0" width="2.3" height="2.512"/>
      <rect x="70" y="0" width="2.3" height="2.512"/>
    </g>
    <path id="arrow" d="M 21.163 31.4 L 31.363 25.08 V 38.19 Z"/>
  </defs>
  <g mask="url(#fade)">
    <use href="#tab" fill="#000000" filter="url(#glow)"/>
    <use href="#tab" fill="url(#gold)"/>
    <g clip-path="url(#inside)">
      <use href="#tab" fill="none" stroke="rgb(100%,95.3%,71.4%)" stroke-width="6.05" opacity="0.99" filter="url(#light)"/>
      <use href="#tab" fill="none" stroke="rgb(100%,96%,43.25%)" stroke-opacity="0.803" stroke-width="0.982"/>
    </g>
  </g>
  <g fill="#ffffff" fill-opacity="0.039">
    <use href="#dots" transform="translate(46.2 23)"/>
    <use href="#dots" transform="translate(46.2 30.2)"/>
    <use href="#dots" transform="translate(46.2 37.887)"/>
  </g>
  <g fill="#000000" fill-opacity="0.253">
    <use href="#dots" transform="translate(46.2 21.663)"/>
    <use href="#dots" transform="translate(46.2 28.8)"/>
    <use href="#dots" transform="translate(46.2 36.4)"/>
  </g>
  <g filter="url(#halo)" fill="#ffffff" fill-opacity="0.518">
    <use href="#arrow"/>
    <use href="#arrow" transform="translate(163 0) scale(-1 1)"/>
  </g>
</svg>
