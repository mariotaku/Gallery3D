<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 65 65"
     g3d:outputs="drawable-mdpi=43x43 drawable-hdpi=65x65">
  <!-- The zoom in key held down: gold glass edged in bright yellow, glowing
       well past its edge, with the magnifier in cream. Drawn in hdpi pixels;
       the fallback drawable's older art is btn_hud_zoom_in_pressed-small.svg. -->
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="11.519" y1="0" x2="65" y2="0">
      <stop offset="0" stop-color="#eaa208"/>
      <stop offset="0.525" stop-color="#f2c03c"/>
      <stop offset="1" stop-color="#fbdc63"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(97%,84%,60%)"/>
      <stop offset="1" stop-color="rgb(96%,94%,73.25%)"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.925" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="key">
      <rect x="11.519" y="10.3" width="80" height="80" rx="5.312"/>
    </clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="3.3"/>
    </filter>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="2.45"/>
    </filter>
    <g id="glyph">
      <circle cx="37.716" cy="35.991" r="8.438" fill="none" stroke-width="4.287"/>
      <line x1="44.95" y1="43.825" x2="52.5" y2="50.9" stroke-width="5.15" stroke-linecap="round"/>
      <rect x="33.6" y="34.7" width="8.95" height="2.6" stroke="none"/>
      <rect x="36.6" y="31.4" width="2.6" height="8.95" stroke="none"/>
    </g>
  </defs>

  <rect x="6.175" y="5.3" width="80" height="80" rx="12.6" fill="#f2bd39" opacity="1" filter="url(#glow)"/>
  <rect x="9.356" y="8.466" width="80" height="80" rx="7.5" fill="#ffe400"/>
  <rect x="11.519" y="10.3" width="80" height="80" rx="5.312" fill="url(#gold)"/>
  <g clip-path="url(#key)">
    <!-- Where this key meets the one below. -->
    <rect x="0" y="62.25" width="65" height="2.375" fill="#b87800" opacity="0.22"/>
  </g>

  <circle cx="37.716" cy="35.991" r="7.9" fill="#8a5c00" opacity="0"/>
  <use href="#glyph" fill="#6a4500" stroke="#6a4500" opacity="0.939" filter="url(#edge)"/>
  <circle cx="37.716" cy="35.991" r="8.438" fill="none" stroke="url(#ring)" stroke-width="4.287" opacity="0.885"/>
  <line x1="44.95" y1="43.825" x2="52.5" y2="50.9" stroke="url(#ring)" stroke-width="5.15" stroke-linecap="round"
        opacity="0.998"/>
  <g fill="rgb(96%,86%,67%)" opacity="0.865">
    <rect x="33.6" y="34.7" width="8.95" height="2.6"/>
    <rect x="36.6" y="31.4" width="2.6" height="8.95"/>
  </g>
  <circle cx="37.716" cy="35.991" r="8.438" fill="none" stroke="url(#catch)" stroke-width="1.675" opacity="0.32"/>
</svg>
