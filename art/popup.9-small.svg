<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 37 42"
     g3d:name="popup.9" g3d:outputs="drawable=39x44"
     g3d:ninepatch="stretch-x=18-18 stretch-y=20-20 pad-x=11-25 pad-y=6-26">
  <!-- The popup's box in the fallback folder, which is tighter than the mdpi
       one: smoked glass in a white rounded border, with a shadow cast
       downward. Only the single middle row and column stretch. -->
  <defs>
    <path id="box" d="M 14.55 3.8 H 22.7 A 6 6 0 0 1 28.7 9.8 V 23.3 A 6 6 0 0 1 22.7 29.3 H 14.55 A 6 6 0 0 1 8.55 23.3 V 9.8 A 6 6 0 0 1 14.55 3.8 Z"/>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="80" height="90">
      <feGaussianBlur stdDeviation="3.7"/>
    </filter>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-20" y="-20" width="80" height="90">
      <rect x="-20" y="-20" width="80" height="90" fill="#ffffff"/>
      <use href="#box" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#outside)">
    <use href="#box" transform="translate(0 4)" fill="#000000" opacity="0.85" filter="url(#shadow)"/>
  </g>
  <use href="#box" fill="#262626" fill-opacity="0.9"/>
  <path d="M 14.55 4.775 H 22.7 A 5.025 5.025 0 0 1 27.725 9.8 V 23.3 A 5.025 5.025 0 0 1 22.7 28.325 H 14.55 A 5.025 5.025 0 0 1 9.525 23.3 V 9.8 A 5.025 5.025 0 0 1 14.55 4.775 Z"
        fill="none" stroke="#ffffff" stroke-width="1.95"/>
</svg>
