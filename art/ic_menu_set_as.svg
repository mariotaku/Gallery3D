<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 72 72"
     g3d:name="ic_menu_set_as" g3d:outputs="drawable=72x72">
  <!-- Set as, in the Android 2.3 menu style: a square picture frame with a
       curved arrow sweeping up out of it and down into a broad head at the
       right. The frame is cut away a few pixels around the arrow. Light grey
       faces, a darker bevel along the top edges, and a faint white glow that
       also shows through the frame's empty middle. Drawn in hdpi pixels. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="18.032" x2="0" y2="55">
      <stop offset="0" stop-color="rgb(255,255,255)"/>
      <stop offset="0.263" stop-color="rgb(255,255,255)"/>
      <stop offset="1" stop-color="rgb(206.25,206.25,206.25)"/>
    </linearGradient>
    <path id="arrow" transform="translate(-0.13 -0.095)"
          d="M28.5 39.8 L28 38.5 L28.08 37.5 L28.06 36.5 L28.25 35.5 L28.41 34.5 L29.01 33.5 L29.07 32.5 L29.37 31.5
             L30.02 30.5 L30.18 29.5 L30.65 28.5 L31.17 27.5 L32 26.5 L32.34 25.5 L33.14 24.5 L34.03 23.5 L34.63 22.5
             L35.61 21.5 L37.06 20.5 L38.45 19.5 L40.8 18.3 L44.2 18.3 L46.75 19.5 L47.96 20.5 L49.35 21.5 L49.97 22.5
             L50.92 23.5 L51.71 24.5 L52.34 25.5 L52.86 26.5 L53.42 27.5 L53.87 28.5 L54.34 29.5 L54.77 30.5 L55.5 31
             L58.5 30 L61.85 30.2 L62.39 31.5 L62 32.5 L61.84 33.5 L61.37 34.5 L60.89 35.5 L60.46 36.5 L59.94 37.5
             L59.52 38.5 L58.96 39.5 L58.58 40.5 L57.98 41.5 L57.64 42.5 L56.99 43.5 L56.62 44.5 L56.2 45.1 L53.8 45.1
             L53.4 44.5 L52.12 43.5 L50.47 42.5 L49.17 41.5 L47.54 40.5 L46.21 39.5 L44.59 38.5 L43.27 37.5 L42.58 36.5
             L43 35.5 L43.93 34.5 L47.46 33.5 L48.01 32.5 L47.4 31.5 L46.58 30.5 L45.67 29.5 L44.5 28.5 L42.39 27.6
             L39.68 27.6 L37.51 28.5 L35.85 29.5 L34.72 30.5 L33.71 31.5 L32.79 32.5 L31.94 33.5 L30.95 34.5 L30.66 35.5
             L29.95 36.5 L29.6 37.5 L29 38.5 L28.84 39.5 Z"/>
    <mask id="frame" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72">
      <rect x="9.931" y="12.076" width="40.838" height="47" fill="#ffffff"/>
      <rect x="18" y="20.002" width="26.096" height="28" fill="#000000"/>
      <use href="#arrow" fill="#000000" stroke="#000000" stroke-width="6.35" stroke-linejoin="round"/>
    </mask>
    <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.3"/>
      <feGaussianBlur stdDeviation="1.32" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.139"/>
      <feComposite in2="blur" operator="in" result="glow1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.1" result="wide"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.289"/>
      <feComposite in2="wide" operator="in" result="glow2"/>
      <feMerge result="glow">
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
      </feMerge>
      <feMorphology in="SourceAlpha" operator="erode" radius="0.786" result="inner"/>
      <feComposite in="SourceAlpha" in2="inner" operator="out" result="rim"/>
      <feGaussianBlur in="rim" stdDeviation="0.181" result="softrim"/>
      <feFlood flood-color="rgb(112.874,112.874,112.874)" flood-opacity="0.281"/>
      <feComposite in2="softrim" operator="in" result="tint"/>
      <feComposite in="tint" in2="SourceAlpha" operator="in" result="shade"/>
      <feOffset in="SourceAlpha" dx="0" dy="1.776" result="shifted"/>
      <feComposite in="SourceAlpha" in2="shifted" operator="out" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="1.371" result="soft"/>
      <feFlood flood-color="rgb(-7.499,-7.499,-7.499)" flood-opacity="0.927"/>
      <feComposite in2="soft" operator="in" result="ttint"/>
      <feComposite in="ttint" in2="SourceAlpha" operator="in" result="top"/>
      <feOffset in="SourceAlpha" dx="0" dy="-1" result="raised"/>
      <feComposite in="SourceAlpha" in2="raised" operator="out" result="lowedge"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.994"/>
      <feComposite in2="lowedge" operator="in" result="lit"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shade"/>
        <feMergeNode in="top"/>
        <feMergeNode in="lit"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#bevel)">
    <rect x="0" y="0" width="72" height="72" fill="url(#face)" mask="url(#frame)"/>
    <use href="#arrow" fill="url(#face)"/>
  </g>
</svg>
