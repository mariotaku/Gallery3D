<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 40 40"
     g3d:outputs="drawable=39x39 drawable-mdpi=40x40 drawable-hdpi=60x60">
  <!-- A web album: the aperture of the Picasa mark. -->
  <defs>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e6e6"/>
    </linearGradient>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <!-- The blades: a pentagon in the middle, each side carried on to the rim. -->
    <mask id="blades" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
      <circle cx="20" cy="20.4" r="8.1" fill="#ffffff"/>
      <path d="M20 16.4 L23.99 19.3 L22.47 23.99 H17.53 L16.01 19.3 Z" fill="#000000"/>
      <g stroke="#000000" stroke-width="0.9">
        <line x1="20" y1="16.4" x2="30.46" y2="24"/>
        <line x1="23.99" y1="19.3" x2="20.01" y2="31.59"/>
        <line x1="22.47" y1="23.99" x2="9.53" y2="23.99"/>
        <line x1="17.53" y1="23.99" x2="13.55" y2="11.7"/>
        <line x1="16.01" y1="19.3" x2="26.47" y2="11.7"/>
      </g>
    </mask>
  </defs>
  <g filter="url(#drop)">
    <circle cx="20" cy="20.4" r="8.1" fill="url(#glyph)" mask="url(#blades)"/>
  </g>
</svg>
