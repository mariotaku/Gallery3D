<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 163 64"
     g3d:outputs="drawable-mdpi=163x64 drawable-hdpi=244x96">
  <!-- The time bar's handle: a glass pill with elliptical ends, a thin grey
       edge, three rows of dimpled grip dots and a white arrow at each end with
       a dark halo, casting a wide soft shadow. The fallback folder's handle,
       square at the bottom, is scroller_new-small.svg.

       The time bar lays out the top 48 rows. The canvas runs 16 more, so the
       pill's lower edge and its shadow fade out in full. TimeBar draws those
       rows below the bar, into the safe area's bottom inset. -->
  <defs>
    <rect id="pill" x="11.278" y="12.786" width="139.55" height="34.43" rx="11.423" ry="17.068"/>
    <clipPath id="inside">
      <use href="#pill"/>
    </clipPath>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="0" y1="12.786" x2="0" y2="47.25">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.021" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.031" stop-color="#ffffff" stop-opacity="0.538"/>
      <stop offset="0.183" stop-color="#ffffff" stop-opacity="0.506"/>
      <stop offset="0.317" stop-color="#ffffff" stop-opacity="0.462"/>
      <stop offset="0.433" stop-color="#ffffff" stop-opacity="0.424"/>
      <stop offset="0.548" stop-color="#ffffff" stop-opacity="0.39"/>
      <stop offset="0.567" stop-color="#ffffff" stop-opacity="0.331"/>
      <stop offset="0.587" stop-color="#ffffff" stop-opacity="0.318"/>
      <stop offset="0.683" stop-color="#ffffff" stop-opacity="0.282"/>
      <stop offset="0.798" stop-color="#ffffff" stop-opacity="0.247"/>
      <stop offset="0.952" stop-color="#ffffff" stop-opacity="0.204"/>
    </linearGradient>
    <filter id="near" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130">
      <feGaussianBlur stdDeviation="3.75"/>
    </filter>
    <filter id="far" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130">
      <feGaussianBlur stdDeviation="8.162"/>
    </filter>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130">
      <rect x="-40" y="-40" width="250" height="130" fill="#ffffff"/>
      <use href="#pill" fill="#000000"/>
    </mask>
    <filter id="halo" filterUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="130"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="2.045" flood-color="#000000" flood-opacity="0.489"/>
    </filter>
    <g id="dots">
      <rect x="0" y="0" width="2.925" height="2.125"/>
      <rect x="8.75" y="0" width="2.925" height="2.125"/>
      <rect x="17.5" y="0" width="2.925" height="2.125"/>
      <rect x="26.25" y="0" width="2.925" height="2.125"/>
      <rect x="35" y="0" width="2.925" height="2.125"/>
      <rect x="43.75" y="0" width="2.925" height="2.125"/>
      <rect x="52.5" y="0" width="2.925" height="2.125"/>
      <rect x="61.25" y="0" width="2.925" height="2.125"/>
      <rect x="70" y="0" width="2.925" height="2.125"/>
    </g>
    <path id="arrow" d="M 21.398 31.473 L 31.799 25.398 V 37.666 Z"/>
  </defs>
  <g mask="url(#outside)">
    <use href="#pill" fill="#000000" opacity="0.28" filter="url(#near)"/>
    <use href="#pill" fill="#000000" opacity="0.247" filter="url(#far)"/>
  </g>
  <use href="#pill" fill="url(#glass)"/>
  <g clip-path="url(#inside)">
    <use href="#pill" fill="none" stroke="rgb(48.125%,48.125%,48.125%)" stroke-opacity="0.227" stroke-width="0.991"/>
  </g>
  <g fill="#000000" fill-opacity="0.203">
    <use href="#dots" transform="translate(44.733 22.131)"/>
    <use href="#dots" transform="translate(44.733 29.2)"/>
    <use href="#dots" transform="translate(44.733 37)"/>
  </g>
  <g filter="url(#halo)" fill="#ffffff" fill-opacity="0.546">
    <use href="#arrow"/>
    <use href="#arrow" transform="translate(163 0) scale(-1 1)"/>
  </g>
</svg>
