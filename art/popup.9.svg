<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 62 67"
     g3d:outputs="drawable-mdpi=64x69"
     g3d:ninepatch="stretch-x=15-46 stretch-y=12-47 pad-x=10-51 pad-y=6-51">
  <!-- The box behind a popup menu or the time bar's label: smoked glass in a
       white rounded border, lifted off the photo by a shadow cast downward.
       The corners are caps, the middle stretches. popup.9-hdpi.svg draws the
       same box with hdpi's guides. -->
  <defs>
    <path id="box" d="M 13.8 4.45 H 48.4 A 5.5 5.5 0 0 1 53.9 9.95 V 48.6 A 5.5 5.5 0 0 1 48.4 54.1 H 13.8 A 5.5 5.5 0 0 1 8.3 48.6 V 9.95 A 5.5 5.5 0 0 1 13.8 4.45 Z"/>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-30" y="-30" width="130" height="140">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-30" y="-30" width="130" height="140">
      <rect x="-30" y="-30" width="130" height="140" fill="#ffffff"/>
      <use href="#box" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#outside)">
    <use href="#box" transform="translate(0 4)" fill="#000000" opacity="0.78" filter="url(#shadow)"/>
  </g>
  <use href="#box" fill="#262626" fill-opacity="0.9"/>
  <path d="M 13.8 5.45 H 48.4 A 4.5 4.5 0 0 1 52.9 9.95 V 48.6 A 4.5 4.5 0 0 1 48.4 53.1 H 13.8 A 4.5 4.5 0 0 1 9.3 48.6 V 9.95 A 4.5 4.5 0 0 1 13.8 5.45 Z"
        fill="none" stroke="#ffffff" stroke-width="2"/>
</svg>
