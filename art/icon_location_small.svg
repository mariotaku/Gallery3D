<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 39 39"
     g3d:outputs="drawable=39x39">
  <!-- The location filter's crumb: a target, as on a map. -->
  <defs>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e2e2"/>
    </linearGradient>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <g filter="url(#drop)" fill="url(#glyph)">
    <path d="M19.5 13.4 A6.1 6.1 0 1 1 19.49 13.4 Z M19.5 15.2 A4.3 4.3 0 1 0 19.51 15.2 Z" fill-rule="evenodd"/>
    <circle cx="19.5" cy="19.5" r="2.3"/>
    <!-- Ticks at the four points of the compass. -->
    <path d="M18.4 13.6 L19.5 10.6 L20.6 13.6 Z"/>
    <path d="M18.4 25.4 L19.5 28.4 L20.6 25.4 Z"/>
    <path d="M13.6 18.4 L10.6 19.5 L13.6 20.6 Z"/>
    <path d="M25.4 18.4 L28.4 19.5 L25.4 20.6 Z"/>
  </g>
</svg>
