<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 43 45"
     g3d:outputs="drawable=43x45 drawable-mdpi=43x45 drawable-hdpi=65x68">
  <!-- The lower half of the zoom rocker: the same smoked glass key, rounded at
       its bottom left and running up into the zoom in key above it. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="6" y1="0" x2="43" y2="0">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="0.17" stop-color="#606060"/>
      <stop offset="0.92" stop-color="#cacaca"/>
      <stop offset="1" stop-color="#d0d0d0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ececec"/>
      <stop offset="1" stop-color="#d4d4d4"/>
    </linearGradient>
    <mask id="outside" maskUnits="userSpaceOnUse" x="0" y="0" width="43" height="45">
      <rect width="43" height="45" fill="#ffffff"/>
      <rect x="6.5" y="-8" width="45" height="46.5" rx="3.5" fill="#000000"/>
    </mask>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-10" y="-20" width="70" height="80">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="emboss" filterUnits="userSpaceOnUse" x="0" y="0" width="43" height="45">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.8" result="grown"/>
      <feFlood flood-color="#1c1c1c" flood-opacity="0.45"/>
      <feComposite in2="grown" operator="in" result="edge"/>
      <feMerge>
        <feMergeNode in="edge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g mask="url(#outside)">
    <rect x="6.5" y="-8" width="45" height="47.5" rx="3.5" fill="#000000" opacity="0.75" filter="url(#shadow)"/>
  </g>
  <rect x="6.5" y="-8" width="45" height="46.5" rx="3.5" fill="url(#face)" opacity="0.41"/>
  <rect x="7" y="-7.5" width="44" height="45.5" rx="3" fill="none" stroke="url(#face)" stroke-width="1" opacity="0.35"/>
  <!-- Where this key meets the one above. -->
  <rect x="6.5" y="0" width="37" height="1" fill="#ffffff" opacity="0.14"/>

  <g filter="url(#emboss)" opacity="0.8">
    <circle cx="26" cy="17" r="5.2" fill="none" stroke="url(#glyph)" stroke-width="3.3"/>
    <rect x="23" y="16" width="6" height="2" fill="#d6d6d6"/>
    <line x1="30.4" y1="21.4" x2="36" y2="27" stroke="#e8e8e8" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>
