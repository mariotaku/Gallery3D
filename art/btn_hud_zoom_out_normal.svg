<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 65 68"
     g3d:outputs="drawable-mdpi=43x45 drawable-hdpi=65x68">
  <!-- The lower half of the zoom rocker: btn_hud_zoom_in_normal.svg's smoked
       glass key turned upside down, so it rounds at its bottom left and runs
       up into the zoom in key, with the magnifier the right way up and a
       minus in its lens. Drawn in hdpi pixels; the fallback drawable's older
       art is btn_hud_zoom_out_normal-small.svg. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="9.572" y1="0" x2="65" y2="0">
      <stop offset="0" stop-color="rgb(27.406%,27.406%,27.406%)"/>
      <stop offset="1" stop-color="rgb(84.75%,84.75%,84.75%)"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(93%,93%,93%)"/>
      <stop offset="1" stop-color="rgb(89.5%,89.5%,89.5%)"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.225" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="key">
      <rect x="9.572" y="8.663" width="80" height="80" rx="7.25"/>
    </clipPath>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <rect x="-20" y="-20" width="120" height="120" fill="#ffffff"/>
      <rect x="9.572" y="8.663" width="80" height="80" rx="7.25" fill="#000000"/>
    </mask>
    <mask id="notGlyph" maskUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <rect x="-20" y="-20" width="120" height="120" fill="#ffffff"/>
      <use href="#glyph" fill="#000000" stroke="#000000"/>
    </mask>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120">
      <feGaussianBlur stdDeviation="2.581"/>
    </filter>
    <g id="glyph">
      <circle cx="37.791" cy="26.796" r="8.431" fill="none" stroke-width="4.335"/>
      <line x1="46.953" y1="36.539" x2="52.434" y2="41.55" stroke-width="5.353" stroke-linecap="round"/>
      <rect x="33.15" y="25.4" width="9.15" height="2.6" stroke="none"/>
    </g>
  </defs>

  <!-- The key in the zoom in key's coordinates, turned over. -->
  <g transform="translate(0 68) scale(1 -1)">
    <g mask="url(#outside)">
      <rect x="9.572" y="8.663" width="80" height="80" rx="7.25" fill="#000000" opacity="0.794" filter="url(#shadow)"/>
    </g>
  </g>
  <!-- The glass is cut away under the magnifier, which is its own paler,
       denser layer rather than a tint on the glass. -->
  <g mask="url(#notGlyph)">
    <g transform="translate(0 68) scale(1 -1)">
      <rect x="9.572" y="8.663" width="80" height="80" rx="7.25" fill="url(#face)" fill-opacity="0.41"/>
      <g clip-path="url(#key)">
        <rect x="9.572" y="8.663" width="80" height="80" rx="7.25" fill="none" stroke="rgb(54.438%,54.438%,54.438%)"
              stroke-opacity="0.377" stroke-width="3.281"/>
        <!-- Where this key meets the one above. -->
        <rect x="0" y="62.925" width="65" height="0.3" fill="#000000" opacity="0.225"/>
      </g>
    </g>
    <circle cx="37.791" cy="26.796" r="8.162" fill="#000000" opacity="0.012"/>
    <use href="#glyph" fill="#000000" stroke="#000000" opacity="0.631" filter="url(#edge)"/>
  </g>
  <circle cx="37.791" cy="26.796" r="8.431" fill="none" stroke="url(#ring)" stroke-width="4.335" opacity="0.74"/>
  <line x1="46.953" y1="36.539" x2="52.434" y2="41.55" stroke="url(#ring)" stroke-width="5.353" stroke-linecap="round"
        opacity="0.76"/>
  <rect x="33.15" y="25.4" width="9.15" height="2.6" fill="rgb(84.625%,84.625%,84.625%)" opacity="0.764"/>
  <!-- The light catching the top of the ring. -->
  <circle cx="37.791" cy="26.796" r="8.431" fill="none" stroke="url(#catch)" stroke-width="0.3" opacity="0.02"/>
</svg>
