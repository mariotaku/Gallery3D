<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 66 42"
     g3d:outputs="drawable=66x42">
  <!-- The zoom in tab held down: gallery_zoom_in.svg's shape in solid gold,
       darker toward the bottom, edged in yellow and glowing, with a cream
       magnifier and its brown edge. -->
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="8.312" x2="0" y2="31.313">
      <stop offset="0" stop-color="#fad54f"/>
      <stop offset="0.556" stop-color="#edb62d"/>
      <stop offset="1" stop-color="#df910f"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-20" width="140" height="80">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="edge" filterUnits="userSpaceOnUse" x="-60" y="-20" width="140" height="80">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <g id="glyph">
      <circle cx="39.494" cy="20.925" r="7.219" fill="none" stroke-width="2.613"/>
      <line x1="46" y1="27.425" x2="51.2" y2="32.3" stroke-width="3" stroke-linecap="round"/>
      <rect x="36" y="20" width="7.3" height="2" stroke="none"/>
      <rect x="39" y="18" width="1.15" height="6.6" stroke="none"/>
    </g>
  </defs>

  <rect x="-40" y="5" width="100.062" height="31.094" rx="13" fill="#e9ad2b" opacity="0.984" filter="url(#glow)"/>
  <rect x="-40" y="6.734" width="98.25" height="27.75" rx="10.938" fill="rgb(97%,80.375%,11.5%)"/>
  <rect x="-40" y="8.312" width="97" height="25" rx="9.25" fill="url(#gold)"/>

  <use href="#glyph" fill="#9a6400" stroke="#9a6400" opacity="0.893" filter="url(#edge)"/>
  <use href="#glyph" fill="rgb(98.5%,99.25%,96.625%)" stroke="rgb(98.5%,99.25%,96.625%)" opacity="0.993"/>
</svg>
