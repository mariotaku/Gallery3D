<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 66 42"
     g3d:outputs="drawable=66x42">
  <!-- The zoom in tab held down: gallery_zoom_in.svg's outline in solid gold,
       darker toward the bottom, edged in yellow and glowing, with a cream
       magnifier and its brown edge. The gold sits a pixel and a half inside
       the yellow edge all the way round, the straight cut included. -->
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="8.5" x2="0" y2="33.5">
      <stop offset="0" stop-color="#fad54f"/>
      <stop offset="0.556" stop-color="#edb62d"/>
      <stop offset="1" stop-color="#df910f"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="106" height="82">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glyphEdge" filterUnits="userSpaceOnUse" x="-20" y="-20" width="106" height="82">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <path id="shape" d="M 1 7 H 46 A 14 14 0 0 1 46 35 H 1 Z"/>
    <path id="body" d="M 2.5 8.5 H 46 A 12.5 12.5 0 0 1 46 33.5 H 2.5 Z"/>
    <g id="glyph">
      <circle cx="40.037" cy="20.942" r="7.198" fill="none" stroke-width="2.55"/>
      <line x1="46.474" y1="27.375" x2="51.974" y2="32.692" stroke-width="2.875" stroke-linecap="round"/>
      <rect x="36.887" y="19.942" width="6.3" height="2" stroke="none"/>
      <rect x="39.037" y="17.792" width="2" height="6.3" stroke="none"/>
    </g>
  </defs>

  <use href="#shape" fill="#e9ad2b" opacity="0.984" filter="url(#glow)"/>
  <use href="#shape" fill="rgb(97%,80.375%,11.5%)"/>
  <use href="#body" fill="url(#gold)"/>

  <use href="#glyph" fill="#9a6400" stroke="#9a6400" opacity="0.893" filter="url(#glyphEdge)"/>
  <use href="#glyph" fill="rgb(98.5%,99.25%,96.625%)" stroke="rgb(98.5%,99.25%,96.625%)" opacity="0.993"/>
</svg>
