<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 72 72"
     g3d:outputs="drawable=72x72">
  <!-- Shows the photo's details: an information disc. Drawn in hdpi pixels. -->
  <defs>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4c4c4"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c5c5c"/>
      <stop offset="1" stop-color="#7a7a7a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <circle cx="35.8" cy="36" r="25.6" fill="url(#glyph)"/>
  </g>
  <!-- The i, pressed into the disc. -->
  <g fill="url(#cut)" stroke="#9a9a9a" stroke-width="0.6">
    <rect x="31.3" y="20" width="9" height="8" rx="1.6"/>
    <rect x="31.4" y="31.8" width="8.8" height="22.4" rx="1.6"/>
  </g>
</svg>
