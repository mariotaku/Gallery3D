<svg xmlns="http://www.w3.org/2000/svg" xmlns:g3d="urn:gallery3d:art" viewBox="0 0 72 72"
     g3d:name="ic_menu_view_details" g3d:outputs="drawable=72x72">
  <!-- Shows the photo's details: an information disc in the Android 2.3 menu
       style. A light grey bevel with a darker rim, a soft white glow around
       it, and the i cut right through, see-through with a faint white glow
       along its inside edge. Drawn in hdpi pixels. -->
  <defs>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="56">
      <stop offset="0" stop-color="rgb(255,255,255)"/>
      <stop offset="0.5" stop-color="rgb(236,236,236)"/>
      <stop offset="0.966" stop-color="rgb(204,204,204)"/>
      <stop offset="1" stop-color="rgb(204,204,204)"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72">
      <rect x="0" y="0" width="72" height="72" fill="#ffffff"/>
      <rect x="31.802" y="21.113" width="8.323" height="8.449" rx="1.069" fill="#000000"/>
      <rect x="31.802" y="34.105" width="8.323" height="19.475" rx="1.069" fill="#000000"/>
    </mask>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72">
      <rect x="31.802" y="21.113" width="8.323" height="8.449" rx="1.069" fill="#ffffff"/>
      <rect x="31.802" y="34.105" width="8.323" height="19.475" rx="1.069" fill="#ffffff"/>
    </mask>
    <clipPath id="disc">
      <circle cx="36.006" cy="36.075" r="25.937"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.223"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.799"/>
    </filter>
  </defs>
  <g mask="url(#cut)">
    <circle cx="36.006" cy="36.075" r="28.055" fill="#ffffff" fill-opacity="0.23" filter="url(#glow)"/>
  </g>
  <g mask="url(#cut)">
    <circle cx="36.006" cy="36.075" r="25.937" fill="url(#face)"/>
    <g clip-path="url(#disc)">
      <circle cx="36.006" cy="36.075" r="25.937" fill="none" stroke="rgb(212.812,212.812,212.812)"
              stroke-opacity="1" stroke-width="3.827"/>
      <g fill="none" stroke="rgb(18.75,18.75,18.75)" stroke-opacity="0.197" stroke-width="2.275">
        <rect x="31.802" y="21.113" width="8.323" height="8.449" rx="1.069"/>
        <rect x="31.802" y="34.105" width="8.323" height="19.475" rx="1.069"/>
      </g>
    </g>
  </g>
  <g mask="url(#holes)">
    <g fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.419" filter="url(#soft)">
      <rect x="31.802" y="21.113" width="8.323" height="8.449" rx="1.069"/>
      <rect x="31.802" y="34.105" width="8.323" height="19.475" rx="1.069"/>
    </g>
  </g>
</svg>
