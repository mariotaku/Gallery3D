# Builds every platform on each push and pull request, and runs the tests on
# the two that have a console to run them in. Each job keeps what it built as
# an artifact.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 packages no SDL3. Debian 13 packages all three libraries.
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config \
            libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev \
            libjpeg-dev liblcms2-dev nlohmann-json3-dev
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows
    # Pinned: the default preset names the Visual Studio 2022 generator.
    runs-on: windows-2022
    env:
      # vcpkg rebuilds SDL and the rest from source. The archives it makes
      # are kept between runs and only rebuilt when the manifest changes.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Use the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: gallery3d-windows
          path: |
            build/Release/gallery3d.exe
            build/Release/*.dll
            build/Release/assets

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install the NDK and CMake the build pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Fetch SDL archives
        run: sh android/fetch-deps.sh
      - name: Build
        working-directory: android
        # Release, because the debug variant builds the native code at -O0 and
        # hides the warnings an optimizing build raises.
        run: sh ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: gallery3d-android
          path: android/app/build/outputs/apk/release/*.apk

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset web
      - name: Build
        run: cmake --build build-web
      - uses: actions/upload-artifact@v4
        with:
          name: gallery3d-web
          path: |
            build-web/index.html
            build-web/index.js
            build-web/index.wasm
            build-web/index.data

  ios:
    name: iOS
    # A real Mac and Xcode, building the app as an ordinary Xcode project. The
    # Linux cross-build in ios/xtool.toolchain.cmake is for machines without one.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ios
      - name: Build
        run: cmake --build --preset ios
      - name: Package
        # Unsigned. Signing needs a developer account, and building needs none.
        run: ditto -c -k --keepParent build-ios/Release-iphoneos/gallery3d.app gallery3d-ios.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gallery3d-ios
          path: gallery3d-ios.zip
