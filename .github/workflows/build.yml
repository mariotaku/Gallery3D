# Builds every platform on each push and pull request, and runs the tests on
# Linux, macOS, Windows and an Android emulator. Each build job keeps what it
# built as an artifact.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 packages no SDL3. Debian 13 packages all three libraries.
    container: debian:trixie
    steps:
      - name: Install dependencies
        # vcpkg generates GLAD, which it does with python3. curl, zip, unzip and
        # tar are what vcpkg's own bootstrap needs.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git zip unzip tar python3 \
            build-essential cmake ninja-build pkg-config \
            libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev \
            libjpeg-dev liblcms2-dev libfontconfig1-dev nlohmann-json3-dev zlib1g-dev
      - uses: actions/checkout@v4
      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    name: Linux sanitizers
    runs-on: ubuntu-24.04
    # LeakSanitizer stops the world through ptrace when the process exits.
    container:
      image: debian:trixie
      options: --cap-add SYS_PTRACE
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git zip unzip tar python3 \
            build-essential cmake ninja-build pkg-config \
            libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev \
            libjpeg-dev liblcms2-dev libfontconfig1-dev nlohmann-json3-dev zlib1g-dev
      - uses: actions/checkout@v4
      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset linux-sanitize
      - name: Build
        run: cmake --build build-sanitize --target gallery3d_tests
      - name: Test
        # A leak, a memory error or undefined behaviour makes the run fail.
        env:
          SDL_VIDEODRIVER: dummy
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure

  macos:
    name: macOS
    # The only run of the Linux and macOS code on a case-insensitive disk.
    runs-on: macos-15
    steps:
      - name: Install dependencies
        run: brew install ninja pkgconf sdl3 sdl3_image sdl3_ttf jpeg-turbo little-cms2 nlohmann-json
      - uses: actions/checkout@v4
      - name: Use runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
      - name: Configure
        # Homebrew keeps jpeg-turbo apart from the system's libjpeg, so CMake
        # is told where it is.
        run: cmake --preset linux -DCMAKE_PREFIX_PATH="$(brew --prefix jpeg-turbo)"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows
    # Pinned: the default preset names the Visual Studio 2022 generator.
    runs-on: windows-2022
    env:
      # vcpkg rebuilds SDL and the rest from source. The archives it makes
      # are kept between runs and only rebuilt when the manifest changes.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Use the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: gallery3d-windows
          path: |
            build/Release/gallery3d.exe
            build/Release/*.dll
            build/Release/assets

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install the NDK and CMake the build pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Fetch SDL archives
        run: sh android/fetch-deps.sh
      - name: Build
        working-directory: android
        # Release, because the debug variant builds the native code at -O0 and
        # hides the warnings an optimizing build raises.
        run: sh ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: gallery3d-android
          path: android/app/build/outputs/apk/release/*.apk

  android-tests:
    name: Android tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install the NDK and CMake the build pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Fetch SDL archives
        run: sh android/fetch-deps.sh
      - name: Free disk space for the emulator
        # The runner starts with about 7 GB free, and the emulator refuses to
        # create its data partition in less than that. None of these are used.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build
        working-directory: android
        # Before the emulator starts, so its time goes to the tests alone.
        run: sh ./gradlew assembleConformance assembleConformanceAndroidTest
      - name: Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 4
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: sh ./gradlew connectedConformanceAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-report
          path: android/app/build/reports/androidTest/connected

  ios:
    name: iOS
    # A real Mac and Xcode, building the app as an ordinary Xcode project. The
    # Linux cross-build in ios/xtool.toolchain.cmake is for machines without one.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ios
      - name: Build
        run: cmake --build --preset ios
      - name: Package
        # Unsigned. Signing needs a developer account, and building needs none.
        run: ditto -c -k --keepParent build-ios/Release-iphoneos/gallery3d.app gallery3d-ios.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gallery3d-ios
          path: gallery3d-ios.zip
